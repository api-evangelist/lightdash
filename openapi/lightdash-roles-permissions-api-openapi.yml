openapi: 3.2.0
info:
  title: Lightdash Roles & Permissions API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Roles & Permissions
  description: These routes allow users to manage roles and permissions for their organization.
  externalDocs:
    url: https://docs.lightdash.com/references/roles
paths:
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}/share/service-accounts:
    get:
      operationId: GetSpaceServiceAccountCandidates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSpaceServiceAccountCandidatesResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: List service accounts eligible for direct access to this space.
      summary: List service account candidates
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: spaceUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}:
    patch:
      operationId: UpdateSpace
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSpaceResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update a space in a project
      summary: Update space
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: The uuid of the space to update
        in: path
        name: spaceUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpace'
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}/access:
    get:
      operationId: GetSpaceAccessList
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSpaceAccessListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the resolved user access list for a space
      summary: List space access
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - description: The uuid of the space
        in: path
        name: spaceUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - in: query
        name: userUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: directOnly
        required: false
        schema:
          type: boolean
  /api/v1/projects/{projectUuid}/spaces:
    post:
      operationId: CreateSpaceInProject
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSpaceResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create a new space inside a project
      summary: Create space
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpace'
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}/share:
    post:
      operationId: AddSpaceUserAccess
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Grant a user access to a space
      summary: Grant user access to space
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: spaceUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSpaceUserAccess'
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}/share/{userUuid}:
    delete:
      operationId: RevokeSpaceAccessForUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove a user's access to a space
      summary: Revoke user access to space
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: The uuid of the space to update
        in: path
        name: spaceUuid
        required: true
        schema:
          type: string
      - description: The uuid of the user to revoke access from
        in: path
        name: userUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}/group/share:
    post:
      operationId: AddSpaceGroupAccess
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Grant a group access to a space
      summary: Grant group access to space
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: The uuid of the space to update
        in: path
        name: spaceUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSpaceGroupAccess'
  /api/v1/projects/{projectUuid}/spaces/{spaceUuid}/group/share/{groupUuid}:
    delete:
      operationId: RevokeGroupSpaceAccess
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove a group's access to a space
      summary: Revoke group access to space
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - description: The uuid of the space's parent project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: The uuid of the space to update
        in: path
        name: spaceUuid
        required: true
        schema:
          type: string
      - description: The uuid of the group to revoke access from
        in: path
        name: groupUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/access:
    get:
      operationId: GetProjectAccessList
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProjectAccessListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Get access list for a project. This is a list of users that have been explictly granted access to the project.

        There may be other users that have access to the project via their organization membership.'
      summary: List project access
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
    post:
      operationId: GrantProjectAccessToUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Grant a user access to a project
      summary: Grant project access to user
      tags:
      - Roles & Permissions
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectMember'
  /api/v1/projects/{projectUuid}/user/{userUuid}:
    get:
      operationId: GetProjectMemberAccess
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetProjectMemberResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Get a project explicit member''s access.

        There may be users that have access to the project via their organization membership.'
      summary: Get project member access
      tags:
      - Roles & Permissions
      deprecated: true
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: userUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/access/{userUuid}:
    patch:
      operationId: UpdateProjectAccessForUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update a user's access to a project
      summary: Update project access for user
      tags:
      - Roles & Permissions
      deprecated: true
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: userUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectMember'
    delete:
      operationId: RevokeProjectAccessForUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove a user's access to a project
      summary: Revoke project access for user
      tags:
      - Roles & Permissions
      deprecated: true
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: userUuid
        required: true
        schema:
          type: string
  /api/v1/org/users/{userUuid}:
    patch:
      operationId: UpdateOrganizationMember
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrganizationMemberProfile'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Updates the membership profile for a user in the current user's organization
      summary: Update organization member
      tags:
      - Roles & Permissions
      deprecated: true
      security: []
      parameters:
      - description: the uuid of the user to update
        in: path
        name: userUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the new membership profile
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMemberProfileUpdate'
              description: the new membership profile
components:
  schemas:
    Pick_SavedChart.updatedAt-or-updatedByUser-or-pinnedListOrder_:
      properties:
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the chart was last updated
        pinnedListOrder:
          type:
          - number
          - 'null'
          format: double
        updatedByUser:
          $ref: '#/components/schemas/UpdatedByUser'
      required:
      - updatedAt
      - pinnedListOrder
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    SpaceShare:
      allOf:
      - $ref: '#/components/schemas/SpaceAccess'
      - $ref: '#/components/schemas/SpaceAccessUserMetadata'
    ? Pick_SavedChart.uuid-or-name-or-description-or-spaceName-or-spaceUuid-or-projectUuid-or-organizationUuid-or-pinnedListUuid-or-dashboardUuid-or-dashboardName-or-dashboardSlug-or-slug_
    : properties:
        description:
          type: string
          description: Optional description of what this chart displays
        name:
          type: string
          description: Display name of the chart
        slug:
          type: string
          description: Unique identifier slug for this chart
        dashboardSlug:
          type:
          - string
          - 'null'
        uuid:
          type: string
        organizationUuid:
          type: string
        projectUuid:
          type: string
        pinnedListUuid:
          type:
          - string
          - 'null'
        spaceUuid:
          type: string
        spaceName:
          type: string
        dashboardUuid:
          type:
          - string
          - 'null'
        dashboardName:
          type:
          - string
          - 'null'
      required:
      - name
      - slug
      - uuid
      - organizationUuid
      - projectUuid
      - pinnedListUuid
      - spaceUuid
      - spaceName
      - dashboardUuid
      - dashboardName
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ChartSourceType:
      enum:
      - dbt_explore
      - sql
      type: string
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    ContentVerificationInfo:
      properties:
        verifiedAt:
          type: string
          format: date-time
        verifiedBy:
          properties:
            lastName:
              type: string
            firstName:
              type: string
            userUuid:
              type: string
          required:
          - lastName
          - firstName
          - userUuid
          type: object
      required:
      - verifiedAt
      - verifiedBy
      type: object
    DashboardOwner:
      properties:
        email:
          type:
          - string
          - 'null'
        lastName:
          type: string
        firstName:
          type: string
        userUuid:
          type: string
      required:
      - email
      - lastName
      - firstName
      - userUuid
      type: object
    HexColor:
      type: string
    ChartSummary:
      allOf:
      - $ref: '#/components/schemas/Pick_SavedChart.uuid-or-name-or-description-or-spaceName-or-spaceUuid-or-projectUuid-or-organizationUuid-or-pinnedListUuid-or-dashboardUuid-or-dashboardName-or-dashboardSlug-or-slug_'
      - properties:
          source:
            $ref: '#/components/schemas/ChartSourceType'
          chartKind:
            $ref: '#/components/schemas/ChartKind'
          chartType:
            $ref: '#/components/schemas/ChartType'
        type: object
    KnexPaginateArgs:
      properties:
        page:
          type: number
          format: double
        pageSize:
          type: number
          format: double
      required:
      - page
      - pageSize
      type: object
    SpaceAccess:
      properties:
        grantSourceUuid:
          type: string
        grantedVia:
          $ref: '#/components/schemas/GrantSource'
        inheritedFrom:
          type: string
          enum:
          - organization
          - project
          - group
          - space_group
          - parent_space
        inheritedRole:
          anyOf:
          - $ref: '#/components/schemas/OrganizationMemberRole'
          - $ref: '#/components/schemas/ProjectMemberRole'
        projectRole:
          $ref: '#/components/schemas/ProjectMemberRole'
        hasDirectAccess:
          type: boolean
        role:
          $ref: '#/components/schemas/SpaceMemberRole'
        userUuid:
          type: string
      required:
      - hasDirectAccess
      - role
      - userUuid
      type: object
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    ApiOrganizationMemberProfile:
      properties:
        results:
          $ref: '#/components/schemas/OrganizationMemberProfile'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    OrganizationMemberProfileUpdate:
      properties:
        role:
          $ref: '#/components/schemas/OrganizationMemberRole'
      required:
      - role
      type: object
    Pick_ServiceAccount.userUuid-or-description_:
      properties:
        description:
          type: string
        userUuid:
          type: string
      required:
      - description
      - userUuid
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ChartKind:
      enum:
      - line
      - horizontal_bar
      - vertical_bar
      - scatter
      - area
      - mixed
      - pie
      - table
      - big_number
      - funnel
      - custom
      - treemap
      - gauge
      - map
      - sankey
      - data_app_viz
      type: string
    ChartType:
      enum:
      - cartesian
      - table
      - big_number
      - pie
      - funnel
      - treemap
      - gauge
      - custom
      - map
      - sankey
      - data_app_viz
      type: string
    ApiProjectAccessListResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ProjectMemberProfile'
          type: array
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    ApiSpaceResponse:
      properties:
        results:
          $ref: '#/components/schemas/Space'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    AddSpaceGroupAccess:
      properties:
        spaceRole:
          $ref: '#/components/schemas/SpaceMemberRole'
        groupUuid:
          type: string
      required:
      - spaceRole
      - groupUuid
      type: object
    Pick_SpaceShare.userUuid-or-role_:
      properties:
        userUuid:
          type: string
        role:
          $ref: '#/components/schemas/SpaceMemberRole'
      required:
      - userUuid
      - role
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    MeshColor:
      type: string
    GrantSource:
      type: string
      enum:
      - app
      - dashboard
      - saved_chart
      - sql_chart
      - document
    OrganizationMemberRole:
      enum:
      - member
      - viewer
      - interactive_viewer
      - editor
      - developer
      - admin
      type: string
    ? Pick_Dashboard.uuid-or-slug-or-name-or-description-or-updatedAt-or-projectUuid-or-updatedByUser-or-organizationUuid-or-spaceUuid-or-views-or-firstViewedAt-or-pinnedListUuid-or-pinnedListOrder_
    : properties:
        description:
          type: string
        name:
          type: string
        slug:
          type: string
        updatedAt:
          type: string
          format: date-time
        uuid:
          type: string
        organizationUuid:
          type: string
        projectUuid:
          type: string
        pinnedListUuid:
          type:
          - string
          - 'null'
        pinnedListOrder:
          type:
          - number
          - 'null'
          format: double
        updatedByUser:
          $ref: '#/components/schemas/UpdatedByUser'
        spaceUuid:
          type: string
        views:
          type: number
          format: double
        firstViewedAt:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - name
      - slug
      - updatedAt
      - uuid
      - organizationUuid
      - projectUuid
      - pinnedListUuid
      - pinnedListOrder
      - spaceUuid
      - views
      - firstViewedAt
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    SpaceAccessUserMetadata:
      properties:
        avatarGradient:
          allOf:
          - $ref: '#/components/schemas/UserAvatarColorValue'
        avatarUrl:
          type:
          - string
          - 'null'
        isInternal:
          type: boolean
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
      required:
      - avatarGradient
      - avatarUrl
      - isInternal
      - email
      - lastName
      - firstName
      type: object
    UserAvatarGradientId:
      type: string
      enum:
      - lilac
      - blush
      - amethyst
      - sunrise
      - slate
      - pearl
    OrganizationMemberProfile:
      properties:
        avatarGradient:
          allOf:
          - $ref: '#/components/schemas/UserAvatarColorValue'
          description: Explicit gradient placeholder override; null falls back to the deterministic gradient
        avatarUrl:
          type:
          - string
          - 'null'
          description: Content-addressed path to the uploaded avatar image; null when none uploaded
        isPending:
          type: boolean
          description: Whether the user doesn't have an authentication method (password or openId)
        isInviteExpired:
          type: boolean
          description: Whether the user's invite to the organization has expired
        isActive:
          type: boolean
          description: Whether the user can login
        hasMultipleRoles:
          type: boolean
          description: True when the member holds extra custom roles beyond `role`/`roleUuid` (see role sets).
        roleUuid:
          type: string
        role:
          $ref: '#/components/schemas/OrganizationMemberRole'
          description: The role of the user in the organization
        organizationUuid:
          type: string
          description: Unique identifier for the organization the user is a member of
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        userUpdatedAt:
          type: string
          format: date-time
        userCreatedAt:
          type: string
          format: date-time
        userUuid:
          type: string
          description: Unique identifier for the user
          format: uuid
      required:
      - avatarGradient
      - avatarUrl
      - isActive
      - role
      - organizationUuid
      - email
      - lastName
      - firstName
      - userUpdatedAt
      - userCreatedAt
      - userUuid
      type: object
      description: Profile for a user's membership in an organization
    ApiSpaceAccessListResponse:
      properties:
        results:
          $ref: '#/components/schemas/KnexPaginatedData_SpaceShare-Array_'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    SpaceQuery:
      allOf:
      - $ref: '#/components/schemas/ChartSummary'
      - $ref: '#/components/schemas/Pick_SavedChart.updatedAt-or-updatedByUser-or-pinnedListOrder_'
      - $ref: '#/components/schemas/ViewStatistics'
      - properties:
          verification:
            allOf:
            - $ref: '#/components/schemas/ContentVerificationInfo'
          validationErrors:
            items:
