openapi: 3.2.0
info:
  title: Lightdash Content Review Requests API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Content Review Requests
paths:
  /api/v1/projects/{projectUuid}/review-requests/settings:
    get:
      operationId: getContentReviewSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewSettingsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Review settings for a project: reviewer group, verify-on-approve default and Slack channel'
      summary: Get review settings
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    patch:
      operationId: updateContentReviewSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewSettingsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Update review settings
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentReviewSettings'
  /api/v1/projects/{projectUuid}/review-requests/similar:
    get:
      operationId: findSimilarContentForReview
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewSimilarContentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Deprecated — use POST /similar for AI-powered chart comparison instead.

        Preserves name matching until 14 December 2026. The replacement requires Ambient AI and a saved chart UUID or metric query context.'
      summary: Find similar content
      tags:
      - Content Review Requests
      deprecated: true
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: contentType
        required: true
        schema:
          $ref: '#/components/schemas/ContentReviewContentType'
      - in: query
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: excludeContentUuid
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      x-mint:
        content: <Warning>This endpoint is deprecated and scheduled for removal after 14 December 2026. Migrate to POST /api/v1/projects/{projectUuid}/review-requests/similar with contentType, name, excludeContentUuid, and chart query context when comparing unsaved charts. The replacement requires Ambient AI; it does not support name-only, SQL chart, or dashboard comparisons.</Warning>
    post:
      operationId: compareSimilarContentForReview
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewSimilarContentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Find related charts using names and query definitions
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindSimilarContentBody'
  /api/v1/projects/{projectUuid}/review-requests/content/{contentType}/{contentUuid}:
    get:
      operationId: getPendingContentReviewRequest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestOrNullResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: The open review request on a chart or dashboard, if any
      summary: Get the pending review request for content
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: contentType
        required: true
        schema:
          $ref: '#/components/schemas/ContentReviewContentType'
      - in: path
        name: contentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/projects/{projectUuid}/review-requests:
    get:
      operationId: listContentReviewRequests
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Requests to review (routed to the caller) or the caller's own requests
      summary: List review requests
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: view
        required: false
        schema:
          $ref: '#/components/schemas/ContentReviewRequestView'
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/ContentReviewRequestStatus'
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          default: 25
          format: double
          type: number
    post:
      operationId: createContentReviewRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Ask for a chart or dashboard in your personal space to be reviewed and moved to a shared space
      summary: Submit a review request
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentReviewRequestBody'
  /api/v1/projects/{projectUuid}/review-requests/{requestUuid}:
    get:
      operationId: getContentReviewRequest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Get a review request
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: requestUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/projects/{projectUuid}/review-requests/{requestUuid}/approve:
    post:
      operationId: approveContentReviewRequest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Move the content to the target space and optionally verify it
      summary: Approve a review request
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: requestUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveContentReviewRequestBody'
  /api/v1/projects/{projectUuid}/review-requests/{requestUuid}/reject:
    post:
      operationId: rejectContentReviewRequest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Reject a review request
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: requestUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectContentReviewRequestBody'
  /api/v1/projects/{projectUuid}/review-requests/{requestUuid}/cancel:
    post:
      operationId: cancelContentReviewRequest
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentReviewRequestResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Cancel your own review request
      tags:
      - Content Review Requests
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: requestUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
components:
  schemas:
    TableCalculationTemplateType.PERCENT_OF_COLUMN_TOTAL:
      enum:
      - percent_of_column_total
      type: string
    BinType.FIXED_WIDTH:
      enum:
      - fixed_width
      type: string
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    FrameBoundary:
      properties:
        offset:
          type: number
          format: double
          description: Offset for PRECEDING/FOLLOWING
        type:
          $ref: '#/components/schemas/FrameBoundaryType'
          description: Boundary type
      required:
      - type
      type: object
    AndFilterGroup:
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with AND logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - and
      - id
      type: object
    SqlTableCalculation:
      allOf:
      - $ref: '#/components/schemas/TableCalculationBase'
      - properties:
          sql:
            type: string
            description: SQL expression for the calculation (can reference fields with ${table.field})
        required:
        - sql
        type: object
    BinRange:
      properties:
        to:
          type: number
          format: double
          description: End value for this bin range (undefined for the last range)
        from:
          type: number
          format: double
          description: Start value for this bin range (undefined for the first range)
      type: object
    ApiContentReviewSettingsResponse:
      properties:
        results:
          $ref: '#/components/schemas/ContentReviewSettings'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    ContentReviewRequestStatus:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
    TemplateTableCalculation:
      allOf:
      - $ref: '#/components/schemas/TableCalculationBase'
      - properties:
          template:
            $ref: '#/components/schemas/TableCalculationTemplate'
            description: Template-based calculation (alternative to sql)
        required:
        - template
        type: object
    MetricOverrides:
      properties: {}
      additionalProperties:
        $ref: '#/components/schemas/Pick_Metric.formatOptions_'
      type: object
    PivotSortAnchor:
      properties:
        value:
          anyOf:
          - type: string
          - type: number
            format: double
          - type: boolean
        reference:
          type: string
      required:
      - value
      - reference
      type: object
      description: 'Coordinates of a single pivot column, used to anchor a row sort to that

        specific column when results are pivoted.'
    FrameClause:
      properties:
        end:
          $ref: '#/components/schemas/FrameBoundary'
          description: End boundary of the frame
        start:
          $ref: '#/components/schemas/FrameBoundary'
          description: Start boundary of the frame
        frameType:
          $ref: '#/components/schemas/FrameType'
          description: Type of frame (ROWS or RANGE)
      required:
      - end
      - frameType
      type: object
    ContentReviewContentType:
      enum:
      - chart
      - dashboard
      - sql_chart
      - document
      type: string
    TableCalculationBase:
      properties:
        totalMode:
          $ref: '#/components/schemas/TableCalculationTotalMode'
          description: How column totals are computed for this calculation
        type:
          $ref: '#/components/schemas/TableCalculationType'
          description: Data type of the calculation result
        format:
          $ref: '#/components/schemas/CustomFormat'
          description: Formatting options for the calculation
        displayName:
          type: string
          description: Display name shown in the UI
        name:
          type: string
          description: Internal name of the table calculation
        index:
          type: number
          format: double
          description: Display order index
      required:
      - displayName
      - name
      type: object
    FrameType:
      enum:
      - rows
      - range
      type: string
    SavedMergeDefinition:
      properties:
        tableCalculations:
          items:
            $ref: '#/components/schemas/MergeTableCalculation'
          type: array
        limit:
          type: number
          format: double
        sort:
          items:
            $ref: '#/components/schemas/SavedMergeDefinitionSort'
          type: array
        keyNames:
          properties: {}
          additionalProperties:
            type: string
          type: object
          description: The key column's name, when not the chart field's id.
        keys:
          properties: {}
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          description: 'The join keys: each entry is the chart''s field and one `query.fieldId`

            reference per other query. The key column takes the chart field''s id.'
        join:
          $ref: '#/components/schemas/MergeJoinType'
        queries:
          properties: {}
          additionalProperties:
            $ref: '#/components/schemas/SavedMergeDefinitionQuery'
          type: object
          description: The other queries, by the name they go by.
        chartRepeats:
          type: boolean
          description: The chart's own query repeats its values. Omitted when off.
        chartAs:
          type: string
          description: The chart query's name in merged column ids, when not its explore's.
      required:
      - limit
      - keys
      - join
      - queries
      type: object
    ContentReviewGrantedPrincipal:
      properties:
        principal:
          $ref: '#/components/schemas/DirectAccessPrincipalRef'
        resourceUuid:
          type: string
        resourceType:
          $ref: '#/components/schemas/DirectAccessResourceType'
      required:
      - principal
      - resourceUuid
      - resourceType
      type: object
    OrFilterGroup:
      properties:
        or:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with OR logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - or
      - id
      type: object
    MergeJoinKeyPart:
      properties:
        fieldIdBySourceId:
          $ref: '#/components/schemas/Record_string.FieldId_'
          description: The field each source joins on. Every source must have an entry.
        name:
          type: string
          description: Column name this key part takes in the merged result.
      required:
      - fieldIdBySourceId
      - name
      type: object
      description: 'One column of the join key. Sources name the same real-world key differently

        (`orders.order_date` vs `users.created_date`), so the mapping is explicit per

        source rather than positional.'
    Filters:
      properties:
        tableCalculations:
          $ref: '#/components/schemas/FilterGroup'
          description: Table calculation filter group
        metrics:
          $ref: '#/components/schemas/FilterGroup'
          description: Metric filter group
        dimensions:
          $ref: '#/components/schemas/FilterGroup'
          description: Dimension filter group
      type: object
    TableCalculation:
      anyOf:
      - $ref: '#/components/schemas/SqlTableCalculation'
      - $ref: '#/components/schemas/TemplateTableCalculation'
      - $ref: '#/components/schemas/FormulaTableCalculation'
    SavedMergeDefinitionQuery:
      properties:
        repeat:
          type: boolean
          description: See MergeQueryMetricSource.repeatValues. Omitted when off.
        timezone:
          type: string
        dimensionOverrides:
          $ref: '#/components/schemas/DimensionOverrides'
        metricOverrides:
          $ref: '#/components/schemas/MetricOverrides'
        customDimensions:
          items:
            $ref: '#/components/schemas/CustomDimension'
          type: array
        additionalMetrics:
          items:
            $ref: '#/components/schemas/AdditionalMetric'
          type: array
        tableCalculations:
          items:
            $ref: '#/components/schemas/TableCalculation'
          type: array
        filters:
          $ref: '#/components/schemas/Filters'
        metrics:
          items:
            $ref: '#/components/schemas/FieldId'
          type: array
        dimensions:
          items:
            $ref: '#/components/schemas/FieldId'
          type: array
        explore:
          type: string
      required:
      - metrics
      - dimensions
      - explore
      type: object
      description: A query the merge owns, run against an explore.
    CreateContentReviewRequestBody:
      properties:
        similarContent:
          items:
            $ref: '#/components/schemas/ContentReviewSimilarContentItem'
          type: array
        note:
          type:
          - string
          - 'null'
        targetSpaceUuid:
          type: string
        contentUuid:
          type: string
        contentType:
          $ref: '#/components/schemas/ContentReviewContentType'
      required:
      - similarContent
      - note
      - targetSpaceUuid
      - contentUuid
      - contentType
      type: object
    FrameBoundaryType:
      enum:
      - unbounded_preceding
      - preceding
      - current_row
      - following
      - unbounded_following
      type: string
    NumberSeparator:
      enum:
      - default
      - commaPeriod
      - spacePeriod
      - periodComma
      - noSeparatorPeriod
      - apostrophePeriod
      type: string
    Pick_CompiledDimension.label-or-name-or-table_:
      properties:
        name:
          type: string
        label:
          type: string
        table:
          type: string
      required:
      - name
      - label
      - table
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    DirectAccessResourceType:
      description: 'Closed registry of resource types that support direct access grants.

        Growing this union means adding a resource registry entry, an

        `AccessTarget` mapping, and grant tables — never a new handler hierarchy.'
      enum:
      - document
      - dashboard
      - chart
      - sqlChart
      - app
      type: string
    Pick_Metric.formatOptions_:
      properties:
        formatOptions:
          $ref: '#/components/schemas/CustomFormat'
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    FixedNumberBinDimension:
      properties:
        id:
          type: string
          description: Unique identifier for the custom dimension
        name:
          type: string
          description: Display name for the custom dimension
        table:
          type: string
          description: Table this custom dimension belongs to
        type:
          $ref: '#/components/schemas/CustomDimensionType.BIN'
          description: Type of custom dimension (bin or sql)
        dimensionId:
          $ref: '#/components/schemas/FieldId'
          description: Field ID of the parent dimension to bin
        binType:
          $ref: '#/components/schemas/BinType.FIXED_NUMBER'
        binNumber:
          type: number
          format: double
      required:
      - id
      - name
      - table
      - type
      - dimensionId
      - binType
      - binNumber
      type: object
      additionalProperties: true
    TableCalculationTemplateType.RUNNING_TOTAL:
      enum:
      - running_total
      type: string
    TableCalculationTotalMode:
      enum:
      - formula
      - sum_of_rows
      - none
      type: string
    CustomRangeBinDimension:
      properties:
        id:
          type: string
          description: Unique identifier for the custom dimension
        name:
          type: string
          description: Display name for the custom dimension
        table:
          type: string
          description: Table this custom dimension belongs to
        type:
          $ref: '#/components/schemas/CustomDimensionType.BIN'
          description: Type of custom dimension (bin or sql)
        dimensionId:
          $ref: '#/components/schemas/FieldId'
          description: Field ID of the parent dimension to bin
        binType:
          $ref: '#/components/schemas/BinType.CUSTOM_RANGE'
        customRange:
          items:
            $ref: '#/components/schemas/BinRange'
          type: array
      required:
      - id
      - name
      - table
      - type
      - dimensionId
      - binType
      - customRange
      type: object
      additionalProperties: true
    TableCalculationTemplateType.RANK_IN_COLUMN:
      enum:
      - rank_in_column
      type: string
    ContentReviewRequestListItem:
      allOf:
      - $ref: '#/components/schemas/ContentReviewRequest'
      - properties:
          targetSpaceName:
            type:
            - string
            - 'null'
          sourceSpaceName:
            type:
            - string
            - 'null'
          content:
            allOf:
            - $ref: '#/components/schemas/ContentReviewContentSummary'
        required:
        - targetSpaceName
        - sourceSpaceName
        - content
        type: object
    Pick_Dimension.formatOptions_:
      properties:
        formatOptions:
          $ref: '#/components/schemas/CustomFormat'
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    SavedMergeQuerySource:
      anyOf:
      - properties:
          kind:
            type: string
            enum:
            - chart
          id:
            type: string
        required:
        - kind
        - id
        type: object
      - properties:
          metricQuery:
            $ref: '#/components/schemas/MetricQuery'
          kind:
            type: string
            enum:
            - query
          id:
            type: string
        required:
        - metricQuery
        - kind
        - id
        type: object
      description: 'A persisted merge source.


        The chart source is a reference: its metric query already lives on the chart

        version. Every additional source owns its query. This keeps one source of

        truth while allowing more sources without adding `thirdQuery`, `fourthQuery`,

        and so on.'
    ApiContentReviewRequestListResponse:
      properties:
        results:
          $ref: '#/components/schemas/KnexPaginatedData_ContentReviewRequestListItem-Array_'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    FilterGroup:
      anyOf:
      - $ref: '#/components/schemas/OrFilterGroup'
      - $ref: '#/components/schemas/AndFilterGroup'
    RejectContentReviewRequestBody:
      properties:
        note:
          type: string
      required:
      - note
      type: object
    ContentReviewSimilarContentItem:
      properties:
        explanation:
          type: string
        matchReason:
          type: string
          enum:
          - same_name
          - similar_name
          - potential_duplicate
          - related
        score:
          type: number
          format: double
        isVerified:
          type: boolean
        spaceName:
          type: string
        spaceUuid:
          type: string
        slug:
          type: string
        name:
          type: string
        contentUuid:
          type: string
        contentType:
          $ref: '#/components/schemas/ContentReviewContentType'
      required:
      - score
      - isVerified
      - spaceName
      - spaceUuid
      - slug
      - name
      - contentUuid
      - contentType
      type: object
    SavedMergeDefinitionSortDirection:
      type: string
      enum:
      - asc
      - desc
    ChartSimilarityRequest:
      properties:
        merge:
          anyOf:
          - $ref: '#/components/schemas/SavedMergeDefinition'
