    get:
      operationId: DownloadOrganizationDesignPackage
      responses:
        '200':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Download a complete organization theme as the canonical theme-as-code

        tar package.'
      summary: Download theme package
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: designUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
  /api/v1/org/designs/{designUuidOrSlug}:
    get:
      operationId: GetOrganizationDesign
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrganizationDesignResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get a single organization design with its files.
      summary: Get organization design
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: designUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
    patch:
      operationId: UpdateOrganizationDesign
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrganizationDesignResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update an organization design's name or description.
      summary: Update organization design
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: designUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationDesignRequest'
    delete:
      operationId: DeleteOrganizationDesign
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Delete an organization design and all its files (cascades S3).
      summary: Delete organization design
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: designUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
  /api/v1/org/designs/package:
    put:
      operationId: ImportOrganizationDesignPackage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrganizationDesignPackageImportResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Create or atomically replace an organization theme from a canonical

        theme-as-code tar package. Send the uncompressed tar as the raw

        `application/x-tar` request body; the manifest slug selects the remote

        theme.'
      summary: Import theme package
      tags:
      - Organizations
      security: []
      parameters: []
  /api/v1/org/designs/default:
    delete:
      operationId: ClearDefaultOrganizationDesign
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Clear whichever design is currently the organization default. Idempotent

        — succeeds when no default is set.


