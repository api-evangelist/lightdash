      operationId: CreateOrganizationDesign
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOrganizationDesignResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
