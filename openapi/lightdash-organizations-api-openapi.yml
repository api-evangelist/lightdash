        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Removes a verified domain and strips it from any SSO provider that routed

        to it.'
      summary: Delete verified domain
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: domain
        required: true
        schema:
          type: string
  /api/v2/orgs/{orgUuid}/code/users:
    get:
      operationId: GetCodeOrganizationUsers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAsCodeListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: orgUuid
        required: true
        schema:
          type: string
      summary: Get code organization users
      x-summary-source: derived
    post:
      operationId: UpsertCodeOrganizationUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAsCodeUpsertResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Organizations
      security: []
      parameters:
      - in: path
        name: orgUuid
        required: true
        schema:
          type: string
      - in: query
        name: sendInvite
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAsCode'
      summary: Upsert code organization user
      x-summary-source: derived
