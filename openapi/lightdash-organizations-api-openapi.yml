        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Removes the current organization's generic OIDC SSO configuration.
      summary: Delete generic OIDC SSO configuration
      tags:
      - Organizations
      security: []
      parameters: []
