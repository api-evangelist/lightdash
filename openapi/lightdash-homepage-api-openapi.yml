components:
  schemas:
    HomepageAskAiHeroBlock:
      properties:
        config:
          properties:
            density:
              $ref: '#/components/schemas/HomepageHeroDensity'
            showRecommendedActions:
              type: boolean
              description: 'Replaces the prompt suggestions with the setup checklist.

                Optional for configs persisted before this field existed.'
            showGreeting:
              type: boolean
          required:
          - showGreeting
          type: object
        type:
          type: string
          enum:
          - ask-ai-hero
        id:
          type: string
      required:
      - config
      - type
      - id
      type: object
    HomepageMarkdownBlock:
      properties:
        config:
          properties:
            content:
              type: string
          required:
          - content
          type: object
        type:
          type: string
          enum:
          - markdown
        id:
          type: string
      required:
      - config
      - type
      - id
      type: object
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    HomepageRecentBlock:
      properties:
        config:
          properties:
            title:
              type: string
          required:
          - title
          type: object
        type:
          type: string
          enum:
          - recent
        id:
          type: string
      required:
      - config
      - type
      - id
      type: object
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    ApiSuccess_ProjectHomepage-Array_:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ProjectHomepage'
          type: array
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    ApiSuccess_HomepageViewAsResult_:
      properties:
        results:
          $ref: '#/components/schemas/HomepageViewAsResult'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    HomepageConfig:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/HomepageRow'
          type: array
        version:
          type: number
          enum:
          - 1
      required:
      - rows
      - version
      type: object
    UpdateAnnouncementRequest:
      properties:
        publishNow:
          type: boolean
          description: 'Unpublished only: publish immediately (fires the pending Slack

            notification, cancels any schedule). Cannot combine with

            `scheduledPublishAt`.'
        scheduledPublishAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Unpublished only: set a future UTC instant to schedule (or reschedule)

            automatic publishing, null to unschedule back to a plain draft.'
        slackChannelId:
          type:
          - string
          - 'null'
          description: 'Only drafts: set to retarget the Slack notification, null to cancel it'
        pinned:
          type: boolean
        category:
          allOf:
          - $ref: '#/components/schemas/AnnouncementCategory'
        body:
          type:
          - string
          - 'null'
        title:
          type: string
      type: object
      description: 'PATCH semantics: omitted fields are left unchanged'
    SkippableHomepageRecommendedActionKey:
      type: string
      enum:
      - add-semantic-layer
      - connect-source-control
      - connect-slack
    HomepageQuickActionTarget:
      anyOf:
      - properties:
          type:
            type: string
            enum:
            - ask-ai
        required:
        - type
        type: object
      - properties:
          type:
            type: string
            enum:
            - run-query
        required:
        - type
        type: object
      - properties:
          type:
            type: string
            enum:
            - browse-dashboards
        required:
        - type
        type: object
      - properties:
          type:
            type: string
            enum:
            - browse-spaces
        required:
        - type
        type: object
      - properties:
          label:
            type: string
          dashboardUuid:
            type: string
          type:
            type: string
            enum:
            - dashboard
        required:
        - label
        - dashboardUuid
        - type
        type: object
      - properties:
          label:
            type: string
          spaceUuid:
            type: string
          type:
            type: string
            enum:
            - space
        required:
        - label
        - spaceUuid
        - type
        type: object
      - properties:
          type:
            type: string
            enum:
            - my-space
        required:
        - type
        type: object
    HomepageCollectionSource:
      type: string
      enum:
      - manual
      - most-viewed
      - recently-updated
      - pinned
      - favorites
      - recently-viewed
      - verified
      description: 'Where a collection block''s items come from.


        `manual` reads the block''s own `items`. Every other source is a live rule

        resolved per viewer at render time — which is the point: a snapshot of

        "most viewed" is stale the week after it''s taken, and a frozen copy of the

        pin list stops tracking pins the moment it''s published.


        `favorites` and `recently-viewed` are per-viewer; the rest are project-wide.'
    UpdateOrganizationHomepageSettings:
      properties:
        opening:
          allOf:
          - $ref: '#/components/schemas/HomepageOpening'
        enabled:
          type: boolean
      required:
      - opening
      - enabled
      type: object
    ApiProjectHomepagesResponse:
      $ref: '#/components/schemas/ApiSuccess_ProjectHomepage-Array_'
    HomepageRecommendedActionKey:
      type: string
      enum:
      - connect-warehouse
      - add-semantic-layer
      - connect-source-control
      - connect-slack
    ApiHomepageAssignmentsResponse:
      $ref: '#/components/schemas/ApiSuccess_HomepageAssignment-Array_'
    PublishProjectHomepageRequest:
      properties:
        audience:
          $ref: '#/components/schemas/HomepageAudience'
      required:
      - audience
      type: object
    ProjectAnnouncement:
      properties:
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        authorName:
          type:
          - string
          - 'null'
        createdByUserUuid:
          type:
          - string
          - 'null'
        scheduledPublishAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When set (and unpublished), the announcement publishes automatically at

            this UTC instant. Null once published or for plain drafts.'
        pendingSlackChannelId:
          type:
