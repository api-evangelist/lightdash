          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Homepage
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      summary: List project homepages
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/homepage/{homepageUuid}:
