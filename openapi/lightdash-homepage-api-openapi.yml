            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Homepage
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          default: 25
          format: double
          type: number
      - in: query
        name: includeUnpublished
        required: false
        schema:
          type: boolean
      summary: List project announcements
      x-summary-source: derived
    post:
      operationId: createProjectAnnouncement
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAnnouncementResponse'
        default:
