      tags:
      - Homepage
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: homepageUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      summary: Delete project homepage
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/homepage/{homepageUuid}/discard-draft:
    post:
      operationId: discardProjectHomepageDraft
      responses:
        '200':
          description: Success
          content:
