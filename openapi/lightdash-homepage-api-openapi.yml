openapi: 3.2.0
info:
  title: Lightdash Homepage API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Homepage
paths:
  /api/v1/projects/{projectUuid}/homepage:
    get:
      operationId: getResolvedProjectHomepage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResolvedHomepageResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Homepage
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      summary: Get resolved project homepage
      x-summary-source: derived
    post:
      operationId: createProjectHomepage
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProjectHomepageResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Homepage
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectHomepageRequest'
      summary: Create project homepage
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/homepage/view-as:
    get:
      operationId: viewHomepageAs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHomepageViewAsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Homepage
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: targetType
        required: true
        schema:
          type: string
          enum:
          - user
          - group
          - role
      - in: query
        name: userUuid
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: groupUuid
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: role
        required: false
        schema:
          $ref: '#/components/schemas/ProjectMemberRole'
      summary: View homepage as
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/homepage/builder:
