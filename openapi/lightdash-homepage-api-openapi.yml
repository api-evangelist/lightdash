      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHomepageGroupPrioritiesRequest'
      summary: Update homepage group priorities
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/homepage/list:
    get:
      operationId: listProjectHomepages
      responses:
        '200':
          description: Success
          content:
            application/json:
