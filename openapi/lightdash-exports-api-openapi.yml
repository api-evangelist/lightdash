openapi: 3.2.0
info:
  title: Lightdash Exports API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Exports
paths:
  /api/v1/csv/{jobId}:
    get:
      operationId: getGsheetExportStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCsvUrlResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the status/URL of a Google Sheets export job
      summary: Get export status
      tags:
      - Exports
      security: []
      parameters:
      - description: the jobId for the export
        in: path
        name: jobId
        required: true
        schema:
          type: string
components:
  schemas:
    ApiErrorPayload:
      properties:
        error:
          properties:
            data:
              $ref: '#/components/schemas/AnyType'
              description: Optional data containing details of the error
            message:
              type: string
              description: A friendly message summarising the error
            name:
              type: string
              description: Unique name for the type of error
            statusCode:
              type: number
              format: integer
              description: HTTP status code
          required:
          - name
          - statusCode
          type: object
        status:
          type: string
          enum:
          - error
      required:
      - error
      - status
      type: object
      description: 'The Error object is returned from the api any time there is an error.

        The message contains'
    ApiCsvUrlResponse:
      properties:
        results:
          properties:
            progress:
              allOf:
              - $ref: '#/components/schemas/GsheetExportProgress'
            truncated:
              type: boolean
            status:
              type: string
            url:
              type: string
          required:
          - progress
          - truncated
          - status
          - url
          type: object
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    GsheetExportProgress:
      properties:
        attempt:
          type: number
          format: double
        phase:
          type: string
          enum:
          - query
          - upload
      required:
      - attempt
      - phase
      type: object
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
  securitySchemes:
    session_cookie:
      type: apiKey
      in: cookie
      name: connect.sid
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: Value should be 'ApiKey <your key>'
