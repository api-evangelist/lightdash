openapi: 3.2.0
info:
  title: Lightdash Projects API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Projects
  description: Projects belong to a single organization. These routes allow users to manage their projects, browse content, and execute queries. Users inside an organization might have access to a project from an organization-level role or they might be granted access to a project directly.
paths:
  /api/v1/projects/{projectUuid}/code/homepages:
    get:
      operationId: getCodeHomepages
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHomepageAsCodeListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: query
        name: names
        required: false
        schema:
          type: array
          items:
            type: string
      summary: Get code homepages
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/code/homepages/{name}:
    post:
      operationId: upsertCodeHomepage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHomepageAsCodeUpsertResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: publish
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomepageAsCode'
      summary: Upsert code homepage
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/slugs/rename:
    post:
      operationId: renameContentSlug
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Rename a project-scoped content slug
      summary: Rename content slug
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSlugRenameRequest'
  /api/v1/projects/{projectUuid}/code/writebacks:
    get:
      operationId: listContentAsCodeWritebacks
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentAsCodeWritebacksResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'List this instance''s content-as-code write-back PRs for the project.

        Pass refresh=true to also re-check open PRs against the git provider

        (a merged PR then reads as merged instead of a stale pending badge).'
      summary: List content-as-code write-backs
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
  /api/v1/projects/{projectUuid}/code/writebacks/charts/{slug}/propose:
    post:
      operationId: proposeChartToGit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentAsCodeProposeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Propose the current instance version of a managed chart back to the

        connected repo: opens (or appends to) this instance''s write-back PR

        for the slug. The retroactive migration path for drifted content.'
      summary: Propose chart to git
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                addToGit:
                  type: boolean
              type: object
  /api/v1/projects/{projectUuid}/code/writebacks/dashboards/{slug}/propose:
    post:
      operationId: proposeDashboardToGit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentAsCodeProposeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Propose the current instance version of a managed dashboard back to

        the connected repo, including its dashboard-owned tile charts. Pass

        addToGit to deliberately add UI-only content to the repo.'
      summary: Propose dashboard to git
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                addToGit:
                  type: boolean
              type: object
  /api/v1/projects/{projectUuid}/code/sync-settings:
    get:
      operationId: getContentAsCodeSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentAsCodeSettingsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: The content_as_code flags last stamped on this project by an upload
      summary: Get content-as-code settings
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
    post:
      operationId: stampContentAsCodeSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Persist the repo''s content_as_code flags as project-level state.

        Called by the CLI at upload time so the instance learns what the

        repo has opted into (Git-backed tracking and write-back).'
      summary: Stamp content-as-code settings
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentAsCodeSettingsStamp'
  /api/v1/projects/{projectUuid}/code/pull:
    post:
      operationId: pullContentAsCodeFromGit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentAsCodePullResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Apply charts and dashboards as code from the project''s repo, the in-app

        equivalent of `lightdash upload`'
      summary: Pull content from git
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/code/upload-advisory:
    get:
      operationId: getContentAsCodeUploadAdvisory
      responses:
        '200':
          description: Success
          content:
            application/json:
