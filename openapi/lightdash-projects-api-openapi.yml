        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Advisory state shown by the CLI before an upload. It never gates upload.
      summary: Get content-as-code upload advisory
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
