  /api/v1/projects/{projectUuid}/code/drafts/{draftUuid}/review:
    get:
      operationId: getContentDraftReview
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentDraftReviewResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'The review payload for one draft: published vs draft as canonical YAML'
      summary: Get content draft review
      tags:
      - Projects
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
