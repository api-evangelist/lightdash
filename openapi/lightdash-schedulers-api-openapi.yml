openapi: 3.2.0
info:
  title: Lightdash Schedulers API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Schedulers
paths:
  /api/v1/schedulers/{schedulerUuid}/ai-augmentation:
    get:
      operationId: getSchedulerAiAugmentation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerAiAugmentationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the AI augmentation attached to a scheduled delivery, or null.
      summary: Get scheduler AI augmentation
      tags:
      - Schedulers
      security: []
      parameters:
      - in: path
        name: schedulerUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    put:
      operationId: upsertSchedulerAiAugmentation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerAiAugmentationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Attach or replace the AI augmentation on a scheduled delivery.
      summary: Upsert scheduler AI augmentation
      tags:
      - Schedulers
      security: []
      parameters:
      - in: path
        name: schedulerUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulerAiAugmentation'
    delete:
      operationId: deleteSchedulerAiAugmentation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove the AI augmentation from a scheduled delivery.
      summary: Delete scheduler AI augmentation
      tags:
      - Schedulers
      security: []
      parameters:
      - in: path
        name: schedulerUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/schedulers/{projectUuid}/logs:
    get:
      operationId: getSchedulerLogs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerLogsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get scheduled logs
      summary: Get scheduler logs
      tags:
      - Schedulers
      deprecated: true
      security: []
      parameters:
      - description: The uuid of the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: number of items per page
        in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - description: page number
        in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - description: search query to filter logs by scheduler name
        in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - description: filter by log statuses (comma-separated)
        in: query
        name: statuses
        required: false
        schema:
          type: string
      - description: filter by creator user UUIDs (comma-separated)
        in: query
        name: createdByUserUuids
        required: false
        schema:
          type: string
      - description: 'filter by destination types (comma-separated: email, slack, msteams, googlechat)'
        in: query
        name: destinations
        required: false
        schema:
          type: string
  /api/v1/schedulers/{projectUuid}/runs:
    get:
      operationId: getSchedulerRuns
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerRunsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get paginated scheduler runs with aggregated child job counts
      summary: List scheduler runs
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: number of items per page
        in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - description: page number
        in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - description: search query to filter runs by scheduler name
        in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - description: column to sort by (scheduledTime, createdAt)
        in: query
        name: sortBy
        required: false
        schema:
          type: string
          enum:
          - scheduledTime
          - createdAt
      - description: sort direction (asc or desc)
        in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: filter by specific scheduler UUIDs (comma-separated)
        in: query
        name: schedulerUuids
        required: false
        schema:
          type: string
      - description: 'filter by run statuses (comma-separated: completed, partial_failure, failed, running, scheduled)'
        in: query
        name: statuses
        required: false
        schema:
          type: string
      - description: filter by creator user UUIDs (comma-separated)
        in: query
        name: createdByUserUuids
        required: false
        schema:
          type: string
      - description: 'filter by destination types (comma-separated: email, slack, msteams, googlechat)'
        in: query
        name: destinations
        required: false
        schema:
          type: string
      - description: filter by resource type (chart or dashboard)
        in: query
        name: resourceType
        required: false
        schema:
          type: string
          enum:
          - chart
          - dashboard
      - description: filter by resource UUIDs (comma-separated)
        in: query
        name: resourceUuids
        required: false
        schema:
          type: string
  /api/v1/schedulers/runs/{runId}/logs:
    get:
      operationId: getRunLogs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerRunLogsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get detailed logs for a specific scheduler run
      summary: Get run logs
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The ID of the run (parent job ID)
        in: path
        name: runId
        required: true
        schema:
          type: string
  /api/v1/schedulers/user-schedulers:
    get:
      operationId: listUserSchedulers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulersResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: List all schedulers for the current user across all projects with pagination, search, sorting, and filtering
      summary: List user schedulers
      tags:
      - Schedulers
      security: []
      parameters:
      - description: number of items per page
        in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - description: page number
        in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - description: search query to filter schedulers by name
        in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - description: column to sort by
        in: query
        name: sortBy
        required: false
        schema:
          type: string
          enum:
          - name
          - createdAt
      - description: sort direction (asc or desc)
        in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: filter by scheduler formats (comma-separated)
        in: query
        name: formats
        required: false
        schema:
          type: string
      - description: filter by resource type (chart or dashboard)
        in: query
        name: resourceType
        required: false
        schema:
          type: string
          enum:
          - chart
          - dashboard
      - description: filter by resource UUIDs (comma-separated)
        in: query
        name: resourceUuids
        required: false
        schema:
          type: string
      - description: 'filter by destination types (comma-separated: email, slack, msteams, googlechat)'
        in: query
        name: destinations
        required: false
        schema:
          type: string
      - description: include latest run information for each scheduler
        in: query
        name: includeLatestRun
        required: false
        schema:
          type: boolean
  /api/v1/schedulers/{projectUuid}/list:
    get:
      operationId: ListSchedulers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulersResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: List all schedulers with pagination, search, sorting, and filtering
      summary: List schedulers
      tags:
      - Schedulers
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: number of items per page
        in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - description: page number
        in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - description: search query to filter schedulers by name
        in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - description: column to sort by
        in: query
        name: sortBy
        required: false
        schema:
          type: string
          enum:
          - name
          - createdAt
      - description: sort direction (asc or desc)
        in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: filter by creator user UUIDs (comma-separated)
        in: query
        name: createdByUserUuids
        required: false
        schema:
          type: string
      - description: filter by scheduler formats (comma-separated)
        in: query
        name: formats
        required: false
        schema:
          type: string
      - description: filter by resource type (chart or dashboard)
        in: query
        name: resourceType
        required: false
        schema:
          type: string
          enum:
          - chart
          - dashboard
      - description: filter by resource UUIDs (comma-separated)
        in: query
        name: resourceUuids
        required: false
        schema:
          type: string
      - description: 'filter by destination types (comma-separated: email, slack, msteams, googlechat)'
        in: query
        name: destinations
        required: false
        schema:
          type: string
      - in: query
        name: includeLatestRun
        required: false
        schema:
          type: boolean
  /api/v1/schedulers/{schedulerUuid}:
    get:
      operationId: getScheduler
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerAndTargetsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get a scheduler
      summary: Get scheduler
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the scheduler to update
        in: path
        name: schedulerUuid
        required: true
        schema:
          type: string
    patch:
      operationId: updateScheduler
      responses:
        '201':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerAndTargetsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update a scheduler
      summary: Update scheduler
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the scheduler to update
        in: path
        name: schedulerUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the new scheduler data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyType'
              description: the new scheduler data
    delete:
      operationId: deleteScheduler
      responses:
        '201':
          description: Deleted
          content:
            application/json:
              schema:
                properties:
                  results: {}
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Delete a scheduler
      summary: Delete scheduler
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the scheduler to delete
        in: path
        name: schedulerUuid
        required: true
        schema:
          type: string
  /api/v1/schedulers/{schedulerUuid}/enabled:
    patch:
      operationId: updateSchedulerEnabled
      responses:
        '201':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSchedulerAndTargetsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Set scheduler enabled
      summary: Update scheduler enabled status
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the scheduler to update
        in: path
        name: schedulerUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the enabled flag
        required: true
        content:
          application/json:
            schema:
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
              type: object
              description: the enabled flag
  /api/v1/schedulers/{projectUuid}/reassign-owner:
    patch:
      operationId: reassignSchedulerOwner
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiReassignSchedulerOwnerResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Reassign ownership of multiple schedulers
      summary: Reassign scheduler owner
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the scheduler UUIDs and new owner UUID
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignSchedulerOwnerRequest'
              description: the scheduler UUIDs and new owner UUID
  /api/v1/schedulers/{schedulerUuid}/jobs:
    get:
      operationId: getScheduledJobs
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiScheduledJobsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Get scheduled jobs
      tags:
      - Schedulers
      deprecated: true
      security: []
      parameters:
      - description: The uuid of the scheduler to update
        in: path
        name: schedulerUuid
        required: true
        schema:
          type: string
  /api/v1/schedulers/job/{jobId}/status:
    get:
      operationId: getSchedulerJobStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobStatusResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Get a generic job status

        This method can be used when polling from the frontend'
      summary: Get scheduler job status
      tags:
      - Schedulers
      security: []
      parameters:
      - description: the jobId for the status to check
        in: path
        name: jobId
        required: true
        schema:
          type: string
  /api/v1/schedulers/send:
    post:
      operationId: sendScheduler
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTestSchedulerResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Send a scheduler now before saving it
      summary: Send scheduler
      tags:
      - Schedulers
      security: []
      parameters: []
      requestBody:
        description: the create scheduler data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnyType'
              description: the create scheduler data
  /api/v1/schedulers/{schedulerUuid}/send:
    post:
      operationId: sendSchedulerByUuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTestSchedulerResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Send an existing scheduler now by its uuid
      summary: Send scheduler by uuid
      tags:
      - Schedulers
      security: []
      parameters:
      - description: The uuid of the scheduler to send now
        in: path
        name: schedulerUuid
        required: true
        schema:
          type: string
components:
  schemas:
    DashboardScheduler:
      allOf:
      - $ref: '#/components/schemas/SchedulerBase'
      - properties:
          selectedTabs:
            items:
              type: string
            type:
            - array
            - 'null'
          customViewportWidth:
            type: number
            format: double
          parameters:
            $ref: '#/components/schemas/ParametersValuesMap'
          filters:
            items:
              $ref: '#/components/schemas/DashboardFilterRule'
            type: array
          appUuid:
            type:
            - number
            - 'null'
            enum:
            - null
          savedSqlUuid:
            type:
            - number
            - 'null'
            enum:
            - null
          dashboardUuid:
            type: string
          savedChartUuid:
            type:
            - number
            - 'null'
            enum:
            - null
        required:
        - selectedTabs
        - appUuid
        - savedSqlUuid
        - dashboardUuid
        - savedChartUuid
        type: object
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    SchedulerRunLogsResponse:
      properties:
        createdByUserName:
          type: string
        createdByUserUuid:
          type: string
        resourceName:
          type: string
        resourceUuid:
          type: string
        resourceType:
          $ref: '#/components/schemas/SchedulerResourceType'
        logs:
          items:
            $ref: '#/components/schemas/SchedulerRunLog'
          type: array
        scheduledTime:
          type: string
          format: date-time
        schedulerName:
          type: string
        schedulerUuid:
          type: string
        runId:
          type: string
      required:
      - createdByUserName
      - createdByUserUuid
      - resourceName
      - resourceUuid
      - resourceType
      - logs
      - scheduledTime
      - schedulerName
      - schedulerUuid
      - runId
      type: object
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    AndFilterGroup:
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with AND logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - and
      - id
      type: object
    ThresholdOptions:
      properties:
        value:
          type: number
          format: double
        fieldId:
          type: string
        operator:
          $ref: '#/components/schemas/ThresholdOperator'
      required:
      - value
      - fieldId
      - operator
      type: object
    ApiSchedulerLogsResponse:
      $ref: '#/components/schemas/ApiSuccess_KnexPaginatedData_SchedulerWithLogs__'
    PartialFailure:
      anyOf:
      - $ref: '#/components/schemas/DashboardChartPartialFailure'
      - $ref: '#/components/schemas/DashboardSqlChartPartialFailure'
      - $ref: '#/components/schemas/MissingTargetsPartialFailure'
      - $ref: '#/components/schemas/AiAugmentationPartialFailure'
      - $ref: '#/components/schemas/AppQueryPartialFailure'
      - $ref: '#/components/schemas/AppQueryMissingPartialFailure'
      - $ref: '#/components/schemas/AppCaptureOverflowPartialFailure'
    FilterRule_FilterOperator.DashboardFieldTarget.AnyType.AnyType_:
      properties:
        includeNull:
          type: boolean
          description: 'For the `equals` operator on string fields, also match rows where the

            field is null (compiles to `field IN (...) OR field IS NULL`). Lets users

            combine null with selected values in a single "is" rule.'
        values:
          items:
            $ref: '#/components/schemas/AnyType'
          type: array
          description: Values to filter by
        operator:
          $ref: '#/components/schemas/FilterOperator'
          description: Filter operator
        id:
          type: string
          description: Unique identifier for the filter
        target:
          $ref: '#/components/schemas/DashboardFieldTarget'
          description: Target field for the filter
        settings:
          $ref: '#/components/schemas/AnyType'
          description: Additional settings for date/time filters
        disabled:
          type: boolean
          description: Whether this filter is disabled
        required:
          type: boolean
          description: Whether this filter is required
        caseSensitive:
          type: boolean
          description: 'Overrides the field/explore case-sensitivity for this rule only.

            Used by internal features like autocomplete search that must always

            match case-insensitively regardless of the field''s configured setting.'
      required:
      - operator
      - id
      - target
      type: object
      additionalProperties: true
    ApiSchedulerRunsResponse:
      $ref: '#/components/schemas/ApiSuccess_KnexPaginatedData_SchedulerRun-Array__'
    PartialFailureType.MISSING_TARGETS:
      enum:
      - missing_targets
      type: string
    SchedulerAiAugmentation:
      anyOf:
      - properties:
          sourceThreadUuid:
            type:
            - string
            - 'null'
          agentUuid:
            type: string
          prompt:
            type: string
          type:
            type: string
            enum:
            - agent
        required:
        - sourceThreadUuid
        - agentUuid
        - prompt
        - type
        type: object
      - properties:
          prompt:
            type: string
          type:
            type: string
            enum:
            - fast_model
        required:
        - prompt
        - type
        type: object
      description: 'Enterprise-only AI augmentation attached to a scheduled delivery. On each

        fire the agent (or ambient fast model) writes the delivery message from the

        delivery''s content and the prompt. Persisted in the EE `scheduler_ai_augmentation`

        satellite table, not on the scheduler itself, so OSS carries none of it.'
    PartialFailureType.DASHBOARD_SQL_CHART:
      enum:
      - dashboard_sql_chart
      type: string
    DashboardSqlChartPartialFailure:
      properties:
        error:
          type: string
        tileUuid:
          type: string
        chartName:
          type: string
        savedSqlUuid:
          type: string
        type:
          $ref: '#/components/schemas/PartialFailureType.DASHBOARD_SQL_CHART'
      required:
      - error
      - tileUuid
      - chartName
      - savedSqlUuid
      - type
      type: object
    AppQueryMissingPartialFailure:
      properties:
        label:
