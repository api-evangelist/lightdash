openapi: 3.2.0
info:
  title: Lightdash SQL runner API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: SQL runner
paths:
  /api/v1/projects/{projectUuid}/sqlRunner/tables:
    get:
      operationId: getTables
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWarehouseTablesCatalog'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get warehouse tables for a project
      summary: List warehouse tables
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/fields:
    get:
      operationId: getTableFields
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiWarehouseTableFields'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get fields for a warehouse table
      summary: Get table fields
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: query
        name: tableName
        required: false
        schema:
          type: string
      - in: query
        name: schemaName
        required: false
        schema:
          type: string
      - in: query
        name: databaseName
        required: false
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/run:
    post:
      operationId: runSql
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobScheduledResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Run a SQL query
      summary: Run SQL query
      tags:
      - SQL runner
      deprecated: true
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRunnerBody'
  /api/v1/projects/{projectUuid}/sqlRunner/runPivotQuery:
    post:
      operationId: runSqlPivotQuery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobScheduledResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Run a SQL pivot query
      summary: Run SQL pivot query
      tags:
      - SQL runner
      deprecated: true
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRunnerPivotQueryBody'
  /api/v1/projects/{projectUuid}/sqlRunner/results/{fileId}:
    get:
      operationId: getLocalResults
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyType'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get results from a file stored locally
      summary: Get stored results
      tags:
      - SQL runner
      deprecated: true
      security: []
      parameters:
      - description: the fileId for the file
        in: path
        name: fileId
        required: true
        schema:
          type: string
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/saved/{uuid}:
    get:
      operationId: getSavedSqlChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSqlChart'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get saved sql chart
      summary: Get SQL chart
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the uuid for the saved sql chart
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
    patch:
      operationId: updateSqlChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUpdateSqlChart'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update sql chart
      summary: Update SQL chart
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: the uuid for the saved sql chart
        in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        description: the sql chart details to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSqlChart'
              description: the sql chart details to update
    delete:
      operationId: deleteSqlChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Delete sql chart
      summary: Delete SQL chart
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: the uuid for the saved sql chart
        in: path
        name: uuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/saved/slug/{slug}:
    get:
      operationId: getSavedSqlChartBySlug
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSqlChart'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get saved sql chart
      summary: Get SQL chart by slug
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the slug for the saved sql chart
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/saved/slug/{slug}/results-job:
    get:
      operationId: getSavedSqlResultsJob
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobScheduledResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Schedules a job to get its results
      summary: Get SQL chart results job
      tags:
      - SQL runner
      deprecated: true
      security: []
      parameters:
      - description: '- the slug of the saved chart'
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: '- the uuid of the project'
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/saved/{uuid}/results-job:
    get:
      operationId: getSavedSqlResultsJobByUuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobScheduledResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Schedules a job to get its results
      summary: Get SQL chart results job by UUID
      tags:
      - SQL runner
      deprecated: true
      security: []
      parameters:
      - description: '- the uuid of the saved chart'
        in: path
        name: uuid
        required: true
        schema:
          type: string
      - description: '- the uuid of the project'
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/saved:
    post:
      operationId: createSqlChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateSqlChart'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create sql chart
      summary: Create SQL chart
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the sql chart to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSqlChart'
              description: the sql chart to create
  /api/v1/projects/{projectUuid}/sqlRunner/saved/{uuid}/promote:
    post:
      operationId: promoteSqlChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSqlChart'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Promote SQL chart to upstream project
      summary: Promote SQL chart
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: the uuid for the saved sql chart
        in: path
        name: uuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/saved/{uuid}/promoteDiff:
    get:
      operationId: promoteSqlChartDiff
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPromotionChangesResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get diff from SQL chart to promote
      summary: Get SQL chart promotion diff
      tags:
      - SQL runner
      security: []
      parameters:
      - description: the uuid for the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: the uuid for the saved sql chart
        in: path
        name: uuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/refresh-catalog:
    post:
      operationId: refreshSqlRunnerCatalog
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Refresh the catalog cache
      summary: Refresh catalog cache
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/virtual-view:
    post:
      operationId: createVirtualView
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateVirtualView'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create a virtual-view
      summary: Create virtual view
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualViewPayload'
  /api/v1/projects/{projectUuid}/sqlRunner/virtual-view/{name}:
    put:
      operationId: updateVirtualView
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateVirtualView'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update a virtual view
      summary: Update virtual view
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVirtualViewPayload'
    delete:
      operationId: deleteVirtualView
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Delete a virtual-view
      summary: Delete virtual view
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/sqlRunner/preview:
    post:
      operationId: writeBackPreview
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGithubDbtWritePreview'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Preview write back from SQL runner
      summary: Preview write back
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualViewPayload'
  /api/v1/projects/{projectUuid}/sqlRunner/pull-request:
    post:
      operationId: writeBackCreatePr
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGithubDbtWriteBack'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Write back from SQL runner
      summary: Create write back PR
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualViewPayload'
  /api/v1/projects/{projectUuid}/sqlRunner/saved/{savedSqlUuid}/schedulers:
    get:
      operationId: getSqlChartSchedulers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    items:
                      $ref: '#/components/schemas/SchedulerAndTargets'
                    type: array
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get all schedulers for a SQL chart
      summary: List SQL chart schedulers
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: savedSqlUuid
        required: true
        schema:
          type: string
    post:
      operationId: createSqlChartScheduler
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/SchedulerAndTargets'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create a scheduler for a SQL chart
      summary: Create SQL chart scheduler
      tags:
      - SQL runner
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: savedSqlUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedulerAndTargetsWithoutIds'
components:
  schemas:
    DashboardScheduler:
      allOf:
      - $ref: '#/components/schemas/SchedulerBase'
      - properties:
          selectedTabs:
            items:
              type: string
            type:
            - array
            - 'null'
          customViewportWidth:
            type: number
            format: double
          parameters:
            $ref: '#/components/schemas/ParametersValuesMap'
          filters:
            items:
              $ref: '#/components/schemas/DashboardFilterRule'
            type: array
          appUuid:
            type:
            - number
            - 'null'
            enum:
            - null
          savedSqlUuid:
            type:
            - number
            - 'null'
            enum:
            - null
          dashboardUuid:
            type: string
          savedChartUuid:
            type:
            - number
            - 'null'
            enum:
            - null
        required:
        - selectedTabs
        - appUuid
        - savedSqlUuid
        - dashboardUuid
        - savedChartUuid
        type: object
    TableCalculationTemplateType.PERCENT_OF_COLUMN_TOTAL:
      enum:
      - percent_of_column_total
      type: string
    VizBarChartConfig:
      allOf:
      - $ref: '#/components/schemas/VizBaseConfig'
      - properties:
          display:
            $ref: '#/components/schemas/CartesianChartDisplay'
          fieldConfig:
            $ref: '#/components/schemas/PivotChartLayout'
          type:
            $ref: '#/components/schemas/ChartKind.VERTICAL_BAR'
        required:
        - type
        type: object
    FrameBoundary:
      properties:
        offset:
          type: number
          format: double
          description: Offset for PRECEDING/FOLLOWING
        type:
          $ref: '#/components/schemas/FrameBoundaryType'
          description: Boundary type
      required:
      - type
      type: object
    AndFilterGroup:
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with AND logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - and
      - id
      type: object
    DashboardSqlChartTile:
      allOf:
      - $ref: '#/components/schemas/DashboardTileBase'
      - $ref: '#/components/schemas/DashboardSqlChartTileProperties'
    ThresholdOptions:
      properties:
        value:
          type: number
          format: double
        fieldId:
          type: string
        operator:
          $ref: '#/components/schemas/ThresholdOperator'
      required:
      - value
      - fieldId
      - operator
      type: object
    FilterOperator.GREATER_THAN:
      enum:
      - greaterThan
      type: string
    WarehouseTableType:
      enum:
      - table
      - view
      - materialized_view
      - external
      type: string
    Omit_SavedChart.inheritsFromOrgOrProject-or-access_:
      $ref: '#/components/schemas/Pick_SavedChart.Exclude_keyofSavedChart.inheritsFromOrgOrProject-or-access__'
      description: Construct a type with the properties of T except for those in type K.
    PivotValue:
      properties:
        value:
          description: Pivot value
        field:
          type: string
          description: Pivot field ID
      required:
      - value
      - field
      type: object
    VizBaseConfig:
      properties:
        type:
          $ref: '#/components/schemas/ChartKind'
        metadata:
          properties:
            version:
              type: number
              format: double
          required:
          - version
          type: object
      required:
      - type
      - metadata
      type: object
    VizBigNumberConditionalOperator:
      anyOf:
      - $ref: '#/components/schemas/FilterOperator.EQUALS'
      - $ref: '#/components/schemas/FilterOperator.NOT_EQUALS'
      - $ref: '#/components/schemas/FilterOperator.LESS_THAN'
      - $ref: '#/components/schemas/FilterOperator.LESS_THAN_OR_EQUAL'
      - $ref: '#/components/schemas/FilterOperator.GREATER_THAN'
      - $ref: '#/components/schemas/FilterOperator.GREATER_THAN_OR_EQUAL'
      description: Operators a big number threshold can be expressed with.
    DashboardTileTypes.HEADING:
      enum:
      - heading
      type: string
    OrganizationMemberRole:
      enum:
      - member
      - viewer
      - interactive_viewer
      - editor
      - developer
      - admin
      type: string
    MapTileBackground:
      enum:
      - none
      - openstreetmap
      - light
      - dark
      - satellite
      - voyager
      type: string
    SpaceMemberRole:
      enum:
      - viewer
      - editor
      - admin
      type: string
    MarkLineData:
      properties:
        dynamicValue:
          type: string
          enum:
          - average
          description: Dynamic value type
        label:
          properties:
            position:
              type: string
              enum:
              - start
              - middle
              - end
              description: Label position
            formatter:
              type: string
              description: Label formatter
          type: object
          description: Label configuration for this data point
        lineStyle:
          properties:
            color:
              type: string
              description: Line color
          required:
          - color
          type: object
          description: Line style for this data point
        uuid:
          type: string
          description: Unique identifier for this mark line
        type:
          type: string
          description: Point type (e.g., 'average')
        value:
          type: string
          description: Value to display
        name:
          type: string
          description: Name of the reference line
        xAxis:
          type: string
          description: X axis value for vertical line
        yAxis:
          type: string
          description: Y axis value for horizontal line
      required:
      - uuid
      type: object
    PromotedDashboard:
      allOf:
      - $ref: '#/components/schemas/DashboardDAO'
      - properties:
          spacePath:
            type: string
          spaceSlug:
            type: string
        required:
        - spacePath
        - spaceSlug
        type: object
    OrFilterGroup:
      properties:
        or:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with OR logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - or
      - id
      type: object
    FunnelChartConfig:
      properties:
        config:
          $ref: '#/components/schemas/FunnelChart'
          description: Chart-type-specific configuration
        type:
          $ref: '#/components/schemas/ChartType.FUNNEL'
          description: Type of chart visualization
      required:
      - type
      type: object
    MapChartType:
      enum:
      - scatter
      - area
      - heatmap
      - hexbin
      type: string
    FunnelChartLabelPosition:
      enum:
      - inside
      - left
      - right
      - hidden
      type: string
