openapi: 3.2.0
info:
  title: Lightdash Content API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Content
paths:
  /api/v1/projects/{projectUuid}/pinned-lists/{pinnedListUuid}/items:
    get:
      operationId: getPinnedItems
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPinnedItems'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Get pinned items
      tags:
      - Content
      security: []
      parameters:
      - description: project uuid
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: the list uuid for the pinned items
        in: path
        name: pinnedListUuid
        required: true
        schema:
          type: string
  /api/v1/projects/{projectUuid}/pinned-lists/{pinnedListUuid}/items/order:
    patch:
      operationId: updatePinnedItemsOrder
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPinnedItems'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Update pinned items order
      tags:
      - Content
      security: []
      parameters:
      - description: project uuid
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: the list uuid for the pinned items
        in: path
        name: pinnedListUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the new order of the pinned items
        required: true
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/UpdatePinnedItemOrder'
              type: array
              description: the new order of the pinned items
  /api/v1/projects/{projectUuid}/favorites:
    get:
      operationId: getFavorites
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFavoriteItems'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the current user's favorite items in a project
      summary: Get favorites
      tags:
      - Content
      security: []
      parameters:
      - description: project uuid
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
    patch:
      operationId: toggleFavorite
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToggleFavorite'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Toggle a favorite item for the current user
      summary: Toggle favorite
      tags:
      - Content
      security: []
      parameters:
      - description: project uuid
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the content type and uuid to toggle
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleFavoriteRequest'
              description: the content type and uuid to toggle
  /api/v2/content/recently-viewed:
    get:
      operationId: GetRecentlyViewed
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRecentContentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Content
      security: []
      parameters:
      - in: query
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      summary: Get recently viewed
      x-summary-source: derived
    post:
      operationId: RecordView
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Content
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRecentContentView'
      summary: Record view
      x-summary-source: derived
  /api/v2/content:
    get:
      operationId: ListContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get content (charts, dashboards, spaces)
      summary: List content
      tags:
      - Content
      security: []
      parameters:
      - in: query
        name: projectUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: spaceUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: uuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: parentSpaceUuid
        required: false
        schema:
          type: string
      - in: query
        name: contentTypes
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContentType'
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/ContentSortByColumns'
      - in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: includePersonalDataApps
        required: false
        schema:
          type: boolean
      - in: query
        name: includePersonalDocuments
        required: false
        schema:
          type: boolean
      - in: query
        name: dataAppVizsFilter
        required: false
        schema:
          type: string
          enum:
          - exclude
          - only
      - in: query
        name: ownerUserUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: sharedWithMe
        required: false
        schema:
          type: boolean
      x-operation-id-source: normalized
      x-operation-id-original: List content
  /api/v2/content/{projectUuid}/move:
    post:
      operationId: MoveContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Move a single item (Chart, Dashboard, Space) to another space
      summary: Move content
      tags:
      - Content
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiContentActionBody_ContentActionMove_'
      x-operation-id-source: normalized
      x-operation-id-original: Move content
  /api/v2/content/bulk-action/{projectUuid}/move:
    post:
      operationId: BulkMoveContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Move multiple items (Charts, Dashboards, Spaces) to another space
      summary: Bulk move content
      tags:
      - Content
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiContentBulkActionBody_ContentActionMove_'
      x-operation-id-source: normalized
      x-operation-id-original: Bulk move content
  /api/v2/content/{projectUuid}/delete:
    post:
      operationId: DeleteContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Delete a single item (Chart, Dashboard, Space). Soft-deletes when the

        instance has soft delete enabled, otherwise deletes permanently.'
      summary: Delete content
      tags:
      - Content
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiContentActionBody_ContentActionDelete_'
      x-operation-id-source: normalized
      x-operation-id-original: Delete content
  /api/v2/content/bulk-action/{projectUuid}/delete:
    post:
      operationId: BulkDeleteContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentBulkDeleteResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Delete multiple items (Charts, Dashboards, Spaces). Items the caller

        cannot delete are skipped and reported in the response.'
      summary: Bulk delete content
      tags:
      - Content
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiContentBulkActionBody_ContentActionDelete_'
      x-operation-id-source: normalized
      x-operation-id-original: Bulk delete content
  /api/v2/content/deleted:
    get:
      operationId: ListDeletedContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDeletedContentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get deleted content (soft-deleted charts, dashboards, etc.)
      summary: List deleted content
      tags:
      - Content
      security: []
      parameters:
      - in: query
        name: projectUuids
        required: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: contentTypes
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContentType'
      - in: query
        name: deletedByUserUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: dataAppVizsFilter
        required: false
        schema:
          type: string
          enum:
          - exclude
          - only
      x-operation-id-source: normalized
      x-operation-id-original: List deleted content
  /api/v2/content/{projectUuid}/restore:
    post:
      operationId: RestoreContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Restore a soft-deleted item (chart, dashboard, etc.)
      summary: Restore content
      tags:
      - Content
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRestoreContentBody'
      x-operation-id-source: normalized
      x-operation-id-original: Restore content
  /api/v2/content/{projectUuid}/permanent:
    delete:
      operationId: PermanentlyDeleteContent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Permanently delete a soft-deleted item (chart, dashboard, etc.)
      summary: Permanently delete content
      tags:
      - Content
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiPermanentlyDeleteContentBody'
      x-operation-id-source: normalized
      x-operation-id-original: Permanently delete content
components:
  schemas:
    ChartSourceType:
      enum:
      - dbt_explore
      - sql
      type: string
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    UpdatePinnedItemOrder:
      properties:
        data:
          $ref: '#/components/schemas/Pick_ResourceViewChartItem-at-data-or-ResourceViewDashboardItem-at-data-or-ResourceViewSpaceItem-at-data-or-ResourceViewDataAppItem-at-data-or-ResourceViewDocumentItem-at-data.uuid-or-pinnedListOrder_'
        type:
          $ref: '#/components/schemas/ResourceViewItemType'
      required:
      - data
      - type
      type: object
    DashboardOwner:
      properties:
        email:
          type:
          - string
          - 'null'
        lastName:
          type: string
        firstName:
          type: string
        userUuid:
          type: string
      required:
      - email
      - lastName
      - firstName
      - userUuid
      type: object
    WithDescendantCounts_DeletedDataAppContentSummary.never_:
      $ref: '#/components/schemas/DeletedDataAppContentSummary'
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    ResourceViewItemType.DASHBOARD:
      enum:
      - dashboard
      type: string
    WithDescendantCounts_DeletedDashboardContentSummary.chart-or-scheduler_:
      allOf:
      - $ref: '#/components/schemas/DeletedDashboardContentSummary'
      - properties:
          schedulerCount:
            type: number
            format: double
          chartCount:
            type: number
            format: double
        required:
        - schedulerCount
        - chartCount
        type: object
    ApiRestoreContentBody:
      properties:
        item:
          $ref: '#/components/schemas/DeletedContentItem'
      required:
      - item
      type: object
    ChartType:
      enum:
      - cartesian
      - table
      - big_number
      - pie
      - funnel
      - treemap
      - gauge
      - custom
      - map
      - sankey
      - data_app_viz
      type: string
    ContentActionMove:
      properties:
        targetSpaceUuid:
          type:
          - string
          - 'null'
        type:
          type: string
          enum:
          - move
      required:
      - targetSpaceUuid
      - type
      type: object
    WithDescendantCounts_DeletedDbtChartContentSummary.scheduler_:
      allOf:
      - $ref: '#/components/schemas/DeletedChartBase'
      - properties:
          source:
            $ref: '#/components/schemas/ChartSourceType.DBT_EXPLORE'
        required:
        - source
        type: object
      - properties:
          schedulerCount:
            type: number
            format: double
        required:
        - schedulerCount
        type: object
    WithDescendantCounts_DeletedSpaceContentSummary.nestedSpace-or-dashboard-or-chart-or-scheduler-or-app-or-document_:
      allOf:
      - $ref: '#/components/schemas/DeletedSpaceContentSummary'
      - properties:
          nestedSpaceCount:
            type: number
            format: double
          schedulerCount:
            type: number
            format: double
          appCount:
            type: number
            format: double
          documentCount:
            type: number
            format: double
          dashboardCount:
            type: number
            format: double
          chartCount:
            type: number
            format: double
        required:
        - nestedSpaceCount
        - schedulerCount
        - appCount
        - documentCount
        - dashboardCount
        - chartCount
        type: object
    ApiFavoriteItems:
      properties:
        results:
          $ref: '#/components/schemas/FavoriteItems'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    ApiSuccess_RecentContentEntry-Array_:
      properties:
        results:
          items:
            $ref: '#/components/schemas/RecentContentEntry'
          type: array
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    SpaceMemberRole:
      enum:
      - viewer
      - editor
      - admin
      type: string
    PinnedItems:
      items:
        anyOf:
        - $ref: '#/components/schemas/ResourceViewDashboardItem'
        - $ref: '#/components/schemas/ResourceViewChartItem'
        - $ref: '#/components/schemas/ResourceViewSpaceItem'
        - $ref: '#/components/schemas/ResourceViewDataAppItem'
        - $ref: '#/components/schemas/ResourceViewDocumentItem'
      type: array
    ApiContentBulkActionBody_ContentActionDelete_:
      properties:
        action:
          $ref: '#/components/schemas/ContentActionDelete'
        content:
          items:
            $ref: '#/components/schemas/ItemPayload'
          type: array
      required:
      - action
      - content
      type: object
    ? Pick_ResourceViewChartItem-at-data-or-ResourceViewDashboardItem-at-data-or-ResourceViewSpaceItem-at-data-or-ResourceViewDataAppItem-at-data-or-ResourceViewDocumentItem-at-data.uuid-or-pinnedListOrder_
    : properties:
        uuid:
          type: string
        pinnedListOrder:
          type:
          - number
          - 'null'
          format: double
      required:
      - uuid
      - pinnedListOrder
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ResourceViewItemType.DATA_APP:
      enum:
      - data_app
      type: string
    ContentActionDelete:
      properties:
        type:
          type: string
          enum:
          - delete
      required:
      - type
      type: object
    ResourceViewChartItem:
      properties:
        category:
          $ref: '#/components/schemas/ResourceItemCategory'
        data:
          allOf:
          - $ref: '#/components/schemas/Pick_SpaceQuery.uuid-or-name-or-chartType-or-chartKind-or-firstViewedAt-or-views-or-pinnedListUuid-or-pinnedListOrder-or-spaceUuid-or-description-or-updatedAt-or-updatedByUser-or-validationErrors-or-verification-or-slug_'
          - properties:
              source:
                $ref: '#/components/schemas/ChartSourceType'
            type: object
        type:
          $ref: '#/components/schemas/ResourceViewItemType.CHART'
      required:
      - data
      - type
      type: object
    ChartSourceType.DBT_EXPLORE:
      enum:
      - dbt_explore
      type: string
    ? Pick_DashboardBasicDetails.uuid-or-slug-or-spaceUuid-or-description-or-name-or-views-or-firstViewedAt-or-pinnedListUuid-or-pinnedListOrder-or-updatedAt-or-updatedByUser-or-validationErrors-or-verification-or-owner_
    : properties:
        description:
          type: string
        name:
          type: string
        slug:
          type: string
        updatedAt:
          type: string
          format: date-time
        verification:
          allOf:
          - $ref: '#/components/schemas/ContentVerificationInfo'
        uuid:
          type: string
        pinnedListUuid:
          type:
          - string
          - 'null'
        pinnedListOrder:
          type:
          - number
          - 'null'
          format: double
        updatedByUser:
          $ref: '#/components/schemas/UpdatedByUser'
        spaceUuid:
          type: string
        views:
          type: number
          format: double
        firstViewedAt:
          anyOf:
          - type: string
          - type: string
            format: date-time
        owner:
          allOf:
          - $ref: '#/components/schemas/DashboardOwner'
          description: Only populated by the v2 content API
        validationErrors:
          items:
            $ref: '#/components/schemas/ValidationSummary'
          type: array
      required:
      - name
      - slug
      - updatedAt
      - verification
      - uuid
      - pinnedListUuid
      - pinnedListOrder
      - spaceUuid
      - views
      - firstViewedAt
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ? Pick_SpaceQuery.uuid-or-name-or-chartType-or-chartKind-or-firstViewedAt-or-views-or-pinnedListUuid-or-pinnedListOrder-or-spaceUuid-or-description-or-updatedAt-or-updatedByUser-or-validationErrors-or-verification-or-slug_
    : properties:
        description:
          type: string
          description: Optional description of what this chart displays
        name:
          type: string
          description: Display name of the chart
        slug:
          type: string
          description: Unique identifier slug for this chart
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the chart was last updated
        verification:
          allOf:
          - $ref: '#/components/schemas/ContentVerificationInfo'
        uuid:
          type: string
        chartKind:
          $ref: '#/components/schemas/ChartKind'
        pinnedListUuid:
          type:
          - string
          - 'null'
        pinnedListOrder:
          type:
          - number
          - 'null'
          format: double
        updatedByUser:
          $ref: '#/components/schemas/UpdatedByUser'
        spaceUuid:
          type: string
        views:
          type: number
          format: double
        firstViewedAt:
          anyOf:
          - type: string
          - type: string
            format: date-time
        validationErrors:
          items:
            $ref: '#/components/schemas/ValidationSummary'
          type: array
        chartType:
          $ref: '#/components/schemas/ChartType'
      required:
      - name
      - slug
      - updatedAt
      - verification
      - uuid
      - pinnedListUuid
      - pinnedListOrder
      - spaceUuid
      - views
      - firstViewedAt
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ApiContentBulkActionBody_ContentActionMove_:
      properties:
        action:
          $ref: '#/components/schemas/ContentActionMove'
        content:
          items:
            $ref: '#/components/schemas/ItemPayload'
          type: array
      required:
      - action
      - content
      type: object
    WithDescendantCounts_DeletedDocumentContentSummary.never_:
      $ref: '#/components/schemas/DeletedDocumentContentSummary'
    RecentContentEntry:
      allOf:
      - $ref: '#/components/schemas/RecentContentItem'
      - properties:
          content:
            anyOf:
            - $ref: '#/components/schemas/ChartContent'
            - $ref: '#/components/schemas/DashboardContent'
            - $ref: '#/components/schemas/DataAppContent'
        required:
        - content
        type: object
    ResourceViewSpaceItem:
      properties:
        data:
