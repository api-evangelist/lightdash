openapi: 3.2.0
info:
  title: Lightdash Ee API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Ee
paths:
  /api/v1/ee/projects/{projectUuid}/agent-onboarding:
    post:
      operationId: createAgentOnboardingRun
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAgentOnboardingRunResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Start a server-side agent onboarding run for a prepared project.

        Returns the existing run when one is already active for the project.'
      summary: Start agent onboarding run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
    get:
      operationId: getActiveAgentOnboardingRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAgentOnboardingActiveRunResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Get the agent onboarding run that is currently queued or running for a

        project, if any.'
      summary: Get active agent onboarding run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/agent-onboarding/{agentOnboardingRunUuid}:
    get:
      operationId: getAgentOnboardingRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAgentOnboardingRunResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the durable state and progress events of an agent onboarding run.
      summary: Get agent onboarding run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: agentOnboardingRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/agent-onboarding/{agentOnboardingRunUuid}/file:
    get:
      operationId: getAgentOnboardingFile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAgentOnboardingFileResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Read the latest persisted contents of a generated onboarding file.
      summary: Get onboarding run file
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: agentOnboardingRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: path
        required: true
        schema:
          type: string
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/agent-onboarding/{agentOnboardingRunUuid}/cancel:
    post:
      operationId: cancelAgentOnboardingRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAgentOnboardingRunResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Request cancellation of an agent onboarding run.
      summary: Cancel agent onboarding run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: agentOnboardingRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/ai-deep-research:
    post:
      operationId: createAiDeepResearchRun
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiDeepResearchRunResponse'
        '409':
          description: Deep Research run already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Start a durable Deep Research investigation.
      summary: Start Deep Research run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiDeepResearchRequestBody'
      tags:
      - Ee
    get:
      operationId: listAiDeepResearchRuns
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiDeepResearchRunListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: List the caller's Deep Research runs attached to an agent thread.
      summary: List Deep Research runs
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: threadUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/ai-deep-research/{aiDeepResearchRunUuid}:
    get:
      operationId: getAiDeepResearchRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiDeepResearchRunResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the durable state and result of a Deep Research run.
      summary: Get Deep Research run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: aiDeepResearchRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/ai-deep-research/{aiDeepResearchRunUuid}/charts/{chartKey}/refresh:
    post:
      operationId: refreshAiDeepResearchChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentThreadMessageVizQueryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Re-execute the metric query behind a warehouse-backed report chart to

        load its live results.'
      summary: Refresh Deep Research chart
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: aiDeepResearchRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: chartKey
        required: true
        schema:
          type: string
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/ai-deep-research/{aiDeepResearchRunUuid}/queries/{queryUuid}/results:
    get:
      operationId: getDeepResearchChartQueryResults
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetAsyncQueryResultsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: aiDeepResearchRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: queryUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      tags:
      - Ee
      summary: Get deep research chart query results
      x-summary-source: derived
  /api/v1/ee/projects/{projectUuid}/ai-deep-research/{aiDeepResearchRunUuid}/charts/{queryUuid}:
    get:
      operationId: getAiDeepResearchChart
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiDeepResearchChartResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Load the retained query metadata behind a report chart.
      summary: Get Deep Research chart
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: aiDeepResearchRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: queryUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/ai-deep-research/{aiDeepResearchRunUuid}/events:
    get:
      operationId: listAiDeepResearchEvents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiDeepResearchEventsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'List persisted progress for a Deep Research run in chronological order.

        Pass the returned cursor unchanged to receive only newer events. The

        cursor remains usable when no new events are available.'
      summary: List Deep Research events
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: aiDeepResearchRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: double
          type: number
      tags:
      - Ee
  /api/v1/ee/projects/{projectUuid}/ai-deep-research/{aiDeepResearchRunUuid}/cancel:
    post:
      operationId: cancelAiDeepResearchRun
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiDeepResearchRunResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Cancel a queued run immediately or request cancellation for a running run.
      summary: Cancel Deep Research run
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: aiDeepResearchRunUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - Ee
components:
  schemas:
    Record_string.never_:
      properties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    AgentOnboardingFile:
      properties:
        updatedAt:
          type: string
        sizeBytes:
          type: number
          format: double
        path:
          type: string
      required:
      - updatedAt
      - sizeBytes
      - path
      type: object
    TableCalculationTemplateType.PERCENT_OF_COLUMN_TOTAL:
      enum:
      - percent_of_column_total
      type: string
    BinType.FIXED_WIDTH:
      enum:
      - fixed_width
      type: string
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    PreAggregateMissReason.EXPLORE_RESOLUTION_ERROR:
      enum:
      - explore_resolution_error
      type: string
    AiDeepResearchRun:
      properties:
        completedAt:
          type:
          - string
          - 'null'
        startedAt:
          type:
          - string
          - 'null'
        updatedAt:
          type: string
        createdAt:
          type: string
        cancellationRequestedAt:
          type:
          - string
          - 'null'
        errorMessage:
          type:
          - string
          - 'null'
        metrics:
          $ref: '#/components/schemas/AiDeepResearchRunMetrics'
        executionContextSnapshot:
          allOf:
          - $ref: '#/components/schemas/AiDeepResearchExecutionContextSnapshot'
        budget:
          $ref: '#/components/schemas/AiDeepResearchBudget'
        document:
          allOf:
          - $ref: '#/components/schemas/AiDeepResearchRunDocument'
          description: Null until the report is published as a Document.
        isReportExpired:
          type: boolean
        reportExpiredAt:
          type:
          - string
          - 'null'
        reportExpiresAt:
          type:
          - string
          - 'null'
        resultMarkdown:
          type:
          - string
          - 'null'
          description: The report narrative with compact <chart> references.
        terminalReason:
          allOf:
          - $ref: '#/components/schemas/AiDeepResearchTerminalReason'
        status:
          $ref: '#/components/schemas/AiDeepResearchRunStatus'
        prompt:
          type: string
        entryPoint:
          $ref: '#/components/schemas/AiDeepResearchEntryPoint'
        resumedFromRunUuid:
          type:
          - string
          - 'null'
        promptUuid:
          type: string
        aiThreadUuid:
          type: string
        agentUuid:
          type: string
        projectUuid:
          type: string
        aiDeepResearchRunUuid:
          type: string
      required:
      - completedAt
      - startedAt
      - updatedAt
      - createdAt
      - cancellationRequestedAt
      - errorMessage
      - metrics
      - executionContextSnapshot
      - budget
      - document
      - isReportExpired
      - reportExpiredAt
      - reportExpiresAt
      - resultMarkdown
      - terminalReason
      - status
      - prompt
      - entryPoint
      - resumedFromRunUuid
      - promptUuid
      - aiThreadUuid
      - agentUuid
      - projectUuid
      - aiDeepResearchRunUuid
      type: object
    ApiGetAsyncQueryResults:
      anyOf:
      - $ref: '#/components/schemas/ReadyQueryResultsPage'
      - properties:
          queryUuid:
            type: string
          status:
            anyOf:
            - $ref: '#/components/schemas/QueryHistoryStatus.PENDING'
            - $ref: '#/components/schemas/QueryHistoryStatus.QUEUED'
            - $ref: '#/components/schemas/QueryHistoryStatus.EXECUTING'
            - $ref: '#/components/schemas/QueryHistoryStatus.CANCELLED'
        required:
        - queryUuid
        - status
        type: object
      - properties:
          erroredAt:
            type:
            - string
            - 'null'
            format: date-time
          error:
            type:
            - string
            - 'null'
          queryUuid:
            type: string
          status:
            anyOf:
            - $ref: '#/components/schemas/QueryHistoryStatus.ERROR'
            - $ref: '#/components/schemas/QueryHistoryStatus.EXPIRED'
        required:
        - error
        - queryUuid
        - status
        type: object
    FrameBoundary:
      properties:
        offset:
          type: number
          format: double
          description: Offset for PRECEDING/FOLLOWING
        type:
          $ref: '#/components/schemas/FrameBoundaryType'
          description: Boundary type
      required:
      - type
      type: object
    AndFilterGroup:
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with AND logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - and
      - id
      type: object
    SqlTableCalculation:
      allOf:
      - $ref: '#/components/schemas/TableCalculationBase'
      - properties:
          sql:
            type: string
            description: SQL expression for the calculation (can reference fields with ${table.field})
        required:
        - sql
        type: object
    BinRange:
      properties:
        to:
          type: number
          format: double
          description: End value for this bin range (undefined for the last range)
        from:
          type: number
          format: double
          description: Start value for this bin range (undefined for the first range)
      type: object
    ItemsMap:
      $ref: '#/components/schemas/Record_string.Field-or-TableCalculation-or-CustomDimension-or-Metric_'
    QueryHistoryStatus.ERROR:
      enum:
      - error
      type: string
    AiDeepResearchEntryPoint:
      type: string
      enum:
      - homepage
      - ask_ai
    ApiAiDeepResearchEventsResponse:
      $ref: '#/components/schemas/ApiSuccess_AiDeepResearchEventsPage_'
    TemplateTableCalculation:
      allOf:
      - $ref: '#/components/schemas/TableCalculationBase'
      - properties:
          template:
            $ref: '#/components/schemas/TableCalculationTemplate'
            description: Template-based calculation (alternative to sql)
        required:
        - template
        type: object
    MetricOverrides:
      properties: {}
      additionalProperties:
        $ref: '#/components/schemas/Pick_Metric.formatOptions_'
      type: object
    PreAggregateMissReason.NO_PRE_AGGREGATES_DEFINED:
      enum:
      - no_pre_aggregates_defined
      type: string
    PreAggregateMissReason.DEDUPLICATED_METRIC_REQUIRES_EXACT_MATCH:
      enum:
      - deduplicated_metric_requires_exact_match
      type: string
    PivotSortAnchor:
      properties:
        value:
          anyOf:
          - type: string
          - type: number
            format: double
          - type: boolean
        reference:
          type: string
      required:
      - value
      - reference
      type: object
      description: 'Coordinates of a single pivot column, used to anchor a row sort to that

        specific column when results are pivoted.'
    PreAggregateMissReason.USER_BYPASS:
      enum:
      - user_bypass
      type: string
    FrameClause:
      properties:
        end:
          $ref: '#/components/schemas/FrameBoundary'
          description: End boundary of the frame
        start:
          $ref: '#/components/schemas/FrameBoundary'
          description: Start boundary of the frame
        frameType:
          $ref: '#/components/schemas/FrameType'
          description: Type of frame (ROWS or RANGE)
      required:
      - end
      - frameType
      type: object
    ApiAiAgentThreadMessageVizQuery:
      properties:
        metadata:
          $ref: '#/components/schemas/AiVizMetadata'
        mergeQuery:
          allOf:
          - $ref: '#/components/schemas/MetricSourcedMergeQuery'
          description: The executed merge, so clients need not re-derive it from tool args.
        query:
          $ref: '#/components/schemas/ApiExecuteAsyncMetricQueryResults'
        type:
          $ref: '#/components/schemas/AiResultType'
        source:
          type: string
          enum:
          - semantic
      required:
      - metadata
      - mergeQuery
      - query
      - type
      - source
      type: object
    AgentOnboardingRun:
      properties:
        completedAt:
          type:
          - string
          - 'null'
        startedAt:
          type:
          - string
          - 'null'
        updatedAt:
          type: string
        createdAt:
          type: string
        errorMessage:
          type:
          - string
          - 'null'
        files:
          items:
            $ref: '#/components/schemas/AgentOnboardingFile'
          type: array
        usage:
          allOf:
          - $ref: '#/components/schemas/AgentOnboardingUsage'
        handoff:
          allOf:
          - $ref: '#/components/schemas/AgentOnboardingHandoff'
        events:
          items:
            $ref: '#/components/schemas/AgentOnboardingRunEvent'
          type: array
        stage:
          allOf:
          - $ref: '#/components/schemas/AgentOnboardingStage'
        status:
          $ref: '#/components/schemas/AgentOnboardingRunStatus'
        projectUuid:
          type: string
        agentOnboardingRunUuid:
          type: string
      required:
      - completedAt
      - startedAt
      - updatedAt
      - createdAt
      - errorMessage
      - files
      - usage
      - handoff
      - events
      - stage
      - status
      - projectUuid
      - agentOnboardingRunUuid
      type: object
    PreAggregateMissReason.FILTER_DIMENSION_NOT_IN_PRE_AGGREGATE:
      enum:
      - filter_dimension_not_in_pre_aggregate
      type: string
    QueryHistoryStatus.EXECUTING:
      enum:
      - executing
      type: string
    ApiGetAsyncQueryResultsResponse:
      properties:
        results:
          $ref: '#/components/schemas/ApiGetAsyncQueryResults'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    AiDeepResearchRunDocument:
      properties:
        slug:
          type: string
        name:
          type: string
        documentUuid:
          type: string
      required:
      - slug
      - name
      - documentUuid
      type: object
      description: The Document a run published its report to.
    TableCalculationBase:
      properties:
        totalMode:
          $ref: '#/components/schemas/TableCalculationTotalMode'
          description: How column totals are computed for this calculation
        type:
          $ref: '#/components/schemas/TableCalculationType'
          description: Data type of the calculation result
        format:
          $ref: '#/components/schemas/CustomFormat'
          description: Formatting options for the calculation
        displayName:
          type: string
          description: Display name shown in the UI
        name:
          type: string
          description: Internal name of the table calculation
        index:
          type: number
          format: double
          description: Display order index
      required:
      - displayName
      - name
      type: object
    FieldUrl:
      properties:
        label:
          type: string
        url:
          type: string
      required:
      - label
      - url
      type: object
    FrameType:
      enum:
      - rows
      - range
      type: string
    ResultColumns:
      $ref: '#/components/schemas/Record_string.ResultColumn_'
    FieldType:
      enum:
      - metric
      - dimension
      type: string
    OrFilterGroup:
      properties:
        or:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with OR logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - or
      - id
      type: object
    ApiExecuteAsyncMetricQueryResults:
      allOf:
      - $ref: '#/components/schemas/ApiExecuteAsyncQueryResultsCommon'
      - properties:
          warnings:
            items:
              $ref: '#/components/schemas/QueryWarning'
            type: array
          fields:
            $ref: '#/components/schemas/ItemsMap'
          metricQuery:
            $ref: '#/components/schemas/MetricQuery'
        required:
        - warnings
        - fields
        - metricQuery
        type: object
    ApiAiDeepResearchChartResponse:
      $ref: '#/components/schemas/ApiSuccess_AiDeepResearchChartData_'
    MergeJoinKeyPart:
      properties:
        fieldIdBySourceId:
          $ref: '#/components/schemas/Record_string.FieldId_'
          description: The field each source joins on. Every source must have an entry.
        name:
          type: string
          description: Column name this key part takes in the merged result.
      required:
      - fieldIdBySourceId
      - name
      type: object
      description: 'One column of the join key. Sources name the same real-world key differently

        (`orders.order_date` vs `users.created_date`), so the mapping is explicit per

        source rather than positional.'
    Filters:
      properties:
        tableCalculations:
          $ref: '#/components/schemas/FilterGroup'
          description: Table calculation filter group
        metrics:
          $ref: '#/components/schemas/FilterGroup'
