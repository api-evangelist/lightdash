openapi: 3.2.0
info:
  title: Lightdash Exploring API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Exploring
paths:
  /api/v1/projects/{projectUuid}/explores/{exploreId}/runUnderlyingDataQuery:
    post:
      operationId: postRunUnderlyingDataQuery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRunQueryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Deprecated — use the v2 Execute underlying data endpoint instead.


        This endpoint was deprecated on 20 March 2025 and is past its sunset date (30 April 2025) — it may be removed at any time. Migrate to the v2 async query flow: Execute underlying data, then Get results.'
      summary: Run underlying data query
      tags:
      - Exploring
      deprecated: true
      security: []
      parameters:
      - description: The uuid of the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: table name
        in: path
        name: exploreId
        required: true
        schema:
          type: string
      requestBody:
        description: metricQuery for the chart to run
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricQueryRequest'
              description: metricQuery for the chart to run
      x-mint:
        content: '<Warning>

          **This endpoint is deprecated and past its sunset date (30 April 2025) — it may be removed at any time.**


          Migrate to the v2 async query flow: [Execute underlying data](https://docs.lightdash.com/api-reference/v2/execute-underlying-data) (`POST /api/v2/projects/{projectUuid}/query/underlying-data`) to start the query, then [Get results](https://docs.lightdash.com/api-reference/v2/get-results) to fetch rows. See also [Cancel query](https://docs.lightdash.com/api-reference/v2/cancel-query) and [Download results](https://docs.lightdash.com/api-reference/v2/download-results).

          </Warning>'
  /api/v1/projects/{projectUuid}/explores/{exploreId}/runQuery:
    post:
      operationId: RunMetricQuery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRunQueryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Deprecated — use the v2 Execute metric query endpoint instead.


        This endpoint was deprecated on 20 March 2025 and is past its sunset date (30 April 2025) — it may be removed at any time. Migrate to the v2 async query flow: Execute metric query, then Get results.'
      summary: Run metric query
      tags:
      - Exploring
      deprecated: true
      security: []
      parameters:
      - description: The uuid of the project
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - description: table name
        in: path
        name: exploreId
        required: true
        schema:
          type: string
      requestBody:
        description: metricQuery for the chart to run
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricQueryRequest'
              description: metricQuery for the chart to run
      x-mint:
        content: '<Warning>

          **This endpoint is deprecated and past its sunset date (30 April 2025) — it may be removed at any time.**


          Migrate to the v2 async query flow: [Execute metric query](https://docs.lightdash.com/api-reference/v2/execute-metric-query) (`POST /api/v2/projects/{projectUuid}/query/metric-query`) to start the query, then [Get results](https://docs.lightdash.com/api-reference/v2/get-results) to fetch rows. See also [Cancel query](https://docs.lightdash.com/api-reference/v2/cancel-query) and [Download results](https://docs.lightdash.com/api-reference/v2/download-results).

          </Warning>'
  /api/v1/projects/{projectUuid}/sqlQuery:
    post:
      operationId: RunSqlQuery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/ApiSqlQueryResults'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Deprecated — use the v2 Execute SQL query endpoint instead.


        This endpoint was deprecated on 17 February 2025 and is past its sunset date (17 May 2025) — it may be removed at any time. Migrate to the v2 async query flow: Execute SQL query, then Get results.'
      summary: Run SQL query
      tags:
      - Exploring
      deprecated: true
      security: []
      parameters:
      - description: The uuid of the project to run the query against
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        description: The query to run
        required: true
        content:
          application/json:
            schema:
              properties:
                sql:
                  type: string
              required:
              - sql
              type: object
              description: The query to run
      x-mint:
        content: '<Warning>

          **This endpoint is deprecated and past its sunset date (17 May 2025) — it may be removed at any time.**


          Migrate to the v2 async query flow: [Execute SQL query](https://docs.lightdash.com/api-reference/v2/execute-sql-query) (`POST /api/v2/projects/{projectUuid}/query/sql`) to start the query, then [Get results](https://docs.lightdash.com/api-reference/v2/get-results) to fetch rows. See also [Cancel query](https://docs.lightdash.com/api-reference/v2/cancel-query) and [Download results](https://docs.lightdash.com/api-reference/v2/download-results).

          </Warning>'
  /api/v1/projects/{projectUuid}/mergeQuery/compile:
    post:
      operationId: CompileMergeQuery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/ApiCompiledMergeQueryResults'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Compile several queries into a single merged warehouse statement.


        Returns the statement and the fields it produces, without running it.

        Use it to validate a merge while it is being built: a merge that would

        produce wrong numbers comes back with `errors` and a null `sql` — most

        importantly the fan-out case, where a query still carries a dimension

        that is neither joined on nor pivoted. Run a valid merge with

        POST {projectUuid}/mergeQuery/run.'
      summary: Compile merge query
      tags:
      - Exploring
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileMergeQueryRequest'
  /api/v1/projects/{projectUuid}/mergeQuery/run:
    post:
      operationId: RunMergeQuery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/ApiExecuteAsyncMetricQueryResults'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Run a merge, returning a query uuid to page results from.


        The merged statement is registered as an ordinary async query, so its

        results are fetched, formatted, cancelled and downloaded through the

        same endpoints as any other query — page them with

        GET /api/v2/projects/{projectUuid}/query/{queryUuid}.


        A merge that cannot be run is rejected here rather than returned:

        compile it first to show the problem against the query that caused it.'
      summary: Run merge query
      tags:
      - Exploring
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunMergeQueryRequest'
components:
  schemas:
    TableCalculationTemplateType.PERCENT_OF_COLUMN_TOTAL:
      enum:
      - percent_of_column_total
      type: string
    BinType.FIXED_WIDTH:
      enum:
      - fixed_width
      type: string
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    PreAggregateMissReason.EXPLORE_RESOLUTION_ERROR:
      enum:
      - explore_resolution_error
      type: string
    MergeTerminalWrapper:
      properties:
        sourceLimitExceededSql:
          type:
          - string
          - 'null'
          deprecated: true
        limit:
          type:
          - number
          - 'null'
          format: double
        orderBy:
          items:
            type: string
          type: array
          description: ORDER BY terms in output-alias space, already quoted for the dialect.
      required:
      - sourceLimitExceededSql
      - limit
      - orderBy
      type: object
      description: 'The terminal stage of a merged statement, owned by the run path: sort and

        limit. Kept as data rather than SQL text so the run path can attach it

        above whatever it stacked on the core (for example a pivot), and so the

        composable core stays clean under `SELECT *`.'
    FrameBoundary:
      properties:
        offset:
          type: number
          format: double
          description: Offset for PRECEDING/FOLLOWING
        type:
          $ref: '#/components/schemas/FrameBoundaryType'
          description: Boundary type
      required:
      - type
      type: object
    AndFilterGroup:
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with AND logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - and
      - id
      type: object
    SqlTableCalculation:
      allOf:
      - $ref: '#/components/schemas/TableCalculationBase'
      - properties:
          sql:
            type: string
            description: SQL expression for the calculation (can reference fields with ${table.field})
        required:
        - sql
        type: object
    BinRange:
      properties:
        to:
          type: number
          format: double
          description: End value for this bin range (undefined for the last range)
        from:
          type: number
          format: double
          description: Start value for this bin range (undefined for the first range)
      type: object
    ItemsMap:
      $ref: '#/components/schemas/Record_string.Field-or-TableCalculation-or-CustomDimension-or-Metric_'
    MergeQuery:
      properties:
        limit:
          type: number
          format: double
        sorts:
          items:
            $ref: '#/components/schemas/SortField'
          type: array
          description: 'Sort of the merged result, by merged field id. Legs always run

            unsorted. Optional for compatibility with merges from before it

            existed; absent means join-key order.'
        tableCalculations:
          items:
            $ref: '#/components/schemas/MergeTableCalculation'
          type: array
          description: Calculations over the merged result. Applied last, after any pivot.
        joinType:
          $ref: '#/components/schemas/MergeJoinType'
        joinKey:
          items:
            $ref: '#/components/schemas/MergeJoinKeyPart'
          type: array
        sources:
          items:
            $ref: '#/components/schemas/MergeQuerySource'
          type: array
      required:
      - limit
      - tableCalculations
      - joinType
      - joinKey
      - sources
      type: object
    ApiCompiledMergeQueryResults:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/MergeQueryError'
          type: array
        requiresCompose:
          type: boolean
          deprecated: true
        fieldIdByColumn:
          $ref: '#/components/schemas/Record_string.FieldId_'
          description: 'Field id for each column the statement returns. Warehouse aliases are

            short and positional so they cannot breach an identifier length limit;

            identity lives in `itemsMap`, and rows are rekeyed through this map

            before anything downstream sees them.'
        usedParametersValues:
          $ref: '#/components/schemas/ParametersValuesMap'
          description: Resolved parameter values embedded in the compiled source queries.
        parameterReferences:
          items:
            type: string
          type: array
          description: User parameters referenced by any source query.
        fieldOrigins:
          $ref: '#/components/schemas/MergeFieldOrigins'
          description: Provenance of each field in `itemsMap`.
        itemsMap:
          $ref: '#/components/schemas/ItemsMap'
          description: 'Every merged column as an ordinary field, keyed by field id, so results

            of a merge are consumed exactly like results of a query.'
        fields:
          items:
            $ref: '#/components/schemas/MergeQueryField'
          type: array
          description: Selectable description of every merged column. Empty when sql is null.
        columns:
          allOf:
          - $ref: '#/components/schemas/MergeQueryColumns'
        sorts:
          items:
            $ref: '#/components/schemas/SortField'
          type: array
          description: 'The sorts the merged result honours, by merged field id, each with

            its null placement stated. Empty on an error or an unsorted merge.'
        terminalWrapper:
          allOf:
          - $ref: '#/components/schemas/MergeTerminalWrapper'
          description: The terminal stage `sql` attaches over the core.
        typedColumns:
          items:
            $ref: '#/components/schemas/MergeTypedColumn'
          type:
          - array
          - 'null'
          description: The core's columns, in the order the statement returns them.
        coreSql:
          type:
          - string
          - 'null'
          description: 'The composable core of the join: a self-contained single-statement

            SELECT with no ORDER BY, no LIMIT and no guard column — valid under

            `SELECT *`, so it can back a virtual view. `sql` is this core with the

            terminal wrapper attached.'
        legs:
          items:
            $ref: '#/components/schemas/MergeCompiledLeg'
          type: array
          description: What each source runs on its own, in source order. Empty on an error.
        sql:
          type:
          - string
          - 'null'
          description: The join statement over the `merge_source_N` reference tables.
      required:
      - errors
      - requiresCompose
      - fieldIdByColumn
      - usedParametersValues
      - parameterReferences
      - fieldOrigins
      - itemsMap
      - fields
      - columns
      - sorts
      - terminalWrapper
      - typedColumns
      - coreSql
      - legs
      - sql
      type: object
      description: 'What the compile endpoint returns. `sql` is null exactly when `errors` is

        non-empty: a merge that would produce wrong numbers is reported, not run.


        A merge runs as a composition: each metric source runs on its own as a

        leg, and the join runs on the compose engine over the legs'' results, which

        it reads as `merge_source_N` tables in source order. `legs` and `sql`

        together are the SQL that runs.'
    TemplateTableCalculation:
      allOf:
      - $ref: '#/components/schemas/TableCalculationBase'
      - properties:
          template:
            $ref: '#/components/schemas/TableCalculationTemplate'
            description: Template-based calculation (alternative to sql)
        required:
        - template
        type: object
    MetricOverrides:
      properties: {}
      additionalProperties:
        $ref: '#/components/schemas/Pick_Metric.formatOptions_'
      type: object
    PreAggregateMissReason.NO_PRE_AGGREGATES_DEFINED:
      enum:
      - no_pre_aggregates_defined
      type: string
    PreAggregateMissReason.DEDUPLICATED_METRIC_REQUIRES_EXACT_MATCH:
      enum:
      - deduplicated_metric_requires_exact_match
      type: string
    MergeQuerySource:
      anyOf:
      - $ref: '#/components/schemas/MergeQueryMetricSource'
      - $ref: '#/components/schemas/MergeQueryResultSource'
    PivotSortAnchor:
      properties:
        value:
          anyOf:
          - type: string
          - type: number
            format: double
          - type: boolean
        reference:
          type: string
      required:
      - value
      - reference
      type: object
      description: 'Coordinates of a single pivot column, used to anchor a row sort to that

        specific column when results are pivoted.'
    PreAggregateMissReason.USER_BYPASS:
      enum:
      - user_bypass
      type: string
    FrameClause:
      properties:
        end:
          $ref: '#/components/schemas/FrameBoundary'
          description: End boundary of the frame
        start:
          $ref: '#/components/schemas/FrameBoundary'
          description: Start boundary of the frame
        frameType:
          $ref: '#/components/schemas/FrameType'
          description: Type of frame (ROWS or RANGE)
      required:
      - end
      - frameType
      type: object
    PreAggregateMissReason.FILTER_DIMENSION_NOT_IN_PRE_AGGREGATE:
      enum:
      - filter_dimension_not_in_pre_aggregate
      type: string
    TableCalculationBase:
      properties:
        totalMode:
          $ref: '#/components/schemas/TableCalculationTotalMode'
          description: How column totals are computed for this calculation
        type:
          $ref: '#/components/schemas/TableCalculationType'
          description: Data type of the calculation result
        format:
          $ref: '#/components/schemas/CustomFormat'
          description: Formatting options for the calculation
        displayName:
          type: string
          description: Display name shown in the UI
        name:
          type: string
          description: Internal name of the table calculation
        index:
          type: number
          format: double
          description: Display order index
      required:
      - displayName
      - name
      type: object
    FieldUrl:
      properties:
        label:
          type: string
        url:
          type: string
      required:
      - label
      - url
      type: object
    FrameType:
      enum:
      - rows
      - range
      type: string
    FieldType:
      enum:
      - metric
      - dimension
      type: string
    OrFilterGroup:
      properties:
        or:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with OR logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - or
      - id
      type: object
    Record_string.unknown_:
      properties: {}
      additionalProperties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    ApiExecuteAsyncMetricQueryResults:
      allOf:
      - $ref: '#/components/schemas/ApiExecuteAsyncQueryResultsCommon'
      - properties:
          warnings:
            items:
              $ref: '#/components/schemas/QueryWarning'
            type: array
          fields:
            $ref: '#/components/schemas/ItemsMap'
          metricQuery:
            $ref: '#/components/schemas/MetricQuery'
        required:
        - warnings
        - fields
        - metricQuery
        type: object
    MergeJoinKeyPart:
      properties:
        fieldIdBySourceId:
          $ref: '#/components/schemas/Record_string.FieldId_'
          description: The field each source joins on. Every source must have an entry.
        name:
          type: string
          description: Column name this key part takes in the merged result.
      required:
      - fieldIdBySourceId
      - name
      type: object
      description: 'One column of the join key. Sources name the same real-world key differently

        (`orders.order_date` vs `users.created_date`), so the mapping is explicit per

        source rather than positional.'
    Filters:
      properties:
        tableCalculations:
          $ref: '#/components/schemas/FilterGroup'
          description: Table calculation filter group
        metrics:
          $ref: '#/components/schemas/FilterGroup'
          description: Metric filter group
        dimensions:
          $ref: '#/components/schemas/FilterGroup'
          description: Dimension filter group
      type: object
    TableCalculation:
      anyOf:
      - $ref: '#/components/schemas/SqlTableCalculation'
      - $ref: '#/components/schemas/TemplateTableCalculation'
      - $ref: '#/components/schemas/FormulaTableCalculation'
    ValuesColumn:
      properties:
        aggregation:
          $ref: '#/components/schemas/VizAggregationOptions'
        reference:
          type: string
      required:
      - aggregation
      - reference
      type: object
    DefaultTimeDimension:
      properties:
        interval:
          $ref: '#/components/schemas/TimeFrames'
        field:
          type: string
      required:
      - interval
      - field
      type: object
    CompileMergeQueryRequest:
      properties:
        parameters:
          $ref: '#/components/schemas/ParametersValuesMap'
        mergeQuery:
          $ref: '#/components/schemas/MergeQuery'
      required:
      - mergeQuery
      type: object
      description: 'Body of the compile endpoint: the spec plus the parameter values.'
    FrameBoundaryType:
      enum:
      - unbounded_preceding
      - preceding
      - current_row
      - following
      - unbounded_following
      type: string
    NumberSeparator:
      enum:
      - default
      - commaPeriod
      - spacePeriod
      - periodComma
      - noSeparatorPeriod
      - apostrophePeriod
      type: string
    Record_string._type-DimensionType__:
      properties: {}
      additionalProperties:
        properties:
          type:
            $ref: '#/components/schemas/DimensionType'
        required:
        - type
        type: object
      type: object
      description: Construct a type with a set of properties K of type T
    Pick_CompiledDimension.label-or-name-or-table_:
      properties:
        name:
          type: string
        label:
          type: string
        table:
          type: string
      required:
      - name
      - label
      - table
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Pick_Metric.formatOptions_:
      properties:
        formatOptions:
          $ref: '#/components/schemas/CustomFormat'
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    FixedNumberBinDimension:
      properties:
        id:
          type: string
          description: Unique identifier for the custom dimension
        name:
          type: string
          description: Display name for the custom dimension
        table:
          type: string
          description: Table this custom dimension belongs to
        type:
          $ref: '#/components/schemas/CustomDimensionType.BIN'
          description: Type of custom dimension (bin or sql)
        dimensionId:
          $ref: '#/components/schemas/FieldId'
          description: Field ID of the parent dimension to bin
        binType:
          $ref: '#/components/schemas/BinType.FIXED_NUMBER'
        binNumber:
          type: number
          format: double
      required:
      - id
      - name
      - table
      - type
      - dimensionId
      - binType
      - binNumber
      type: object
      additionalProperties: true
    TableCalculationTemplateType.RUNNING_TOTAL:
      enum:
      - running_total
      type: string
    TableCalculationTotalMode:
      enum:
      - formula
      - sum_of_rows
      - none
      type: string
    CustomRangeBinDimension:
      properties:
        id:
          type: string
          description: Unique identifier for the custom dimension
        name:
          type: string
          description: Display name for the custom dimension
        table:
          type: string
          description: Table this custom dimension belongs to
        type:
          $ref: '#/components/schemas/CustomDimensionType.BIN'
          description: Type of custom dimension (bin or sql)
        dimensionId:
          $ref: '#/components/schemas/FieldId'
          description: Field ID of the parent dimension to bin
        binType:
          $ref: '#/components/schemas/BinType.CUSTOM_RANGE'
        customRange:
          items:
            $ref: '#/components/schemas/BinRange'
          type: array
      required:
      - id
      - name
      - table
      - type
      - dimensionId
      - binType
      - customRange
      type: object
      additionalProperties: true
    Record_FieldId.MergeFieldOrigin_:
      properties: {}
      additionalProperties:
        $ref: '#/components/schemas/MergeFieldOrigin'
      type: object
      description: Construct a type with a set of properties K of type T
    TableCalculationTemplateType.RANK_IN_COLUMN:
      enum:
      - rank_in_column
      type: string
    Pick_Dimension.formatOptions_:
      properties:
        formatOptions:
          $ref: '#/components/schemas/CustomFormat'
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Record_string.Item-or-AdditionalMetric_:
      properties: {}
      additionalProperties:
        anyOf:
        - $ref: '#/components/schemas/TableCalculation'
        - $ref: '#/components/schemas/AdditionalMetric'
        - $ref: '#/components/schemas/CustomDimension'
        - $ref: '#/components/schemas/Metric'
        - $ref: '#/components/schemas/Field'
      type: object
      description: Construct a type with a set of properties K of type T
    RunMergeQueryRequest:
      properties:
        parameters:
          $ref: '#/components/schemas/ParametersValuesMap'
          description: 'Parameter values for every source query, one map for the whole merge —

            two sides of one question should never disagree on a parameter.'
        csvLimit:
          type:
          - number
          - 'null'
          format: double
          description: Export row limit. Null means all rows within the organization's cell cap.
        pivotConfiguration:
          $ref: '#/components/schemas/PivotConfiguration'
        mergeQuery:
          $ref: '#/components/schemas/MergeQuery'
      required:
      - mergeQuery
      type: object
