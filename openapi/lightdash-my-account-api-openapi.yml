openapi: 3.2.0
info:
  title: Lightdash My Account API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: My Account
  description: These routes allow users to manage their own user account.
paths:
  /api/v1/user:
    get:
      operationId: GetAuthenticatedUser
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetAuthenticatedUserResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Get authenticated user
      tags:
      - My Account
      security: []
      parameters: []
    post:
      operationId: RegisterUser
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRegisterUserResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Register user
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrActivateUser'
  /api/v1/user/me/email/otp:
    put:
      operationId: CreateEmailOneTimePasscode
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEmailStatusResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Create a new one-time passcode for the current user''s primary email.

        The user will receive an email with the passcode.'
      summary: Create email one-time passcode
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/user/me/email/status:
    get:
      operationId: GetEmailVerificationStatus
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEmailStatusResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the verification status for the current user's primary email
      summary: Get email verification status
      tags:
      - My Account
      security: []
      parameters:
      - description: the one-time passcode sent to the user's primary email
        in: query
        name: passcode
        required: false
        schema:
          type: string
  /api/v1/user/onboarding:
    get:
      operationId: GetUserOnboarding
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetUserOnboardingResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the authenticated user's onboarding state, i.e. which feature tours they have completed
      summary: Get onboarding
      tags:
      - My Account
      security: []
      parameters: []
    post:
      operationId: CompleteUserOnboardingTour
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Mark a feature tour as completed for the authenticated user
      summary: Complete onboarding tour
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        description: the tour to mark as completed
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCompleteUserOnboardingTourRequest'
              description: the tour to mark as completed
  /api/v1/user/learn-progress:
    get:
      operationId: GetUserLearnProgress
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearnProgressResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Learn walkthrough progress for the authenticated user: what the

        library shows as complete, started, and up next, from any browser.'
      summary: Get Learn progress
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/user/learn-progress/{scope}/started:
    post:
      operationId: MarkUserLearnScopeStarted
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearnProgressResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Record that the authenticated user started a Learn walkthrough.

        The scope must be one the instance''s scope registry knows.'
      summary: Mark Learn walkthrough started
      tags:
      - My Account
      security: []
      parameters:
      - description: the walkthrough's scope, e.g. `view:Dashboard`
        in: path
        name: scope
        required: true
        schema:
          type: string
  /api/v1/user/learn-progress/{scope}/completed:
    post:
      operationId: MarkUserLearnScopeCompleted
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearnProgressResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Record that the authenticated user completed a Learn walkthrough.

        Idempotent: the first completion time is kept.'
      summary: Mark Learn walkthrough completed
      tags:
      - My Account
      security: []
      parameters:
      - description: the walkthrough's scope, e.g. `view:Dashboard`
        in: path
        name: scope
        required: true
        schema:
          type: string
  /api/v1/user/learn-progress/merge:
    post:
      operationId: MergeUserLearnProgress
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearnProgressResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Take in progress a browser recorded before the instance kept it.

        Unioned with what the instance holds; server timestamps win, and

        unknown scopes are dropped.'
      summary: Merge browser Learn progress
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        description: the browser's completed, started and last-started scopes
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeLearnProgressRequest'
              description: the browser's completed, started and last-started scopes
  /api/v1/user/me/allowedOrganizations:
    get:
      operationId: ListMyAvailableOrganizations
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAllowedOrganizationsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'List the organizations that the current user can join.

        This is based on the user''s primary email domain and the organization''s allowed email domains.'
      summary: List available organizations
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/user/me/joinOrganization/{organizationUuid}:
    post:
      operationId: JoinOrganization
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Add the current user to an organization that accepts users with a verified email domain.

        This will fail if the organization email domain does not match the user''s primary email domain.'
      summary: Join organization
      tags:
      - My Account
      security: []
      parameters:
      - description: the uuid of the organization to join
        in: path
        name: organizationUuid
        required: true
        schema:
          type: string
  /api/v1/user/me/leaveOrganization:
    delete:
      operationId: LeaveOrganization
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Remove the current user from their organization. Fails if the caller is

        the only admin remaining. The user record is preserved so they can join

        another organization later.'
      summary: Leave organization
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/user/me:
    delete:
      operationId: DeleteMe
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Delete user
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/user/warehouseCredentials:
    get:
      operationId: getWarehouseCredentials
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  results:
                    items:
                      $ref: '#/components/schemas/UserWarehouseCredentialsWithAgentStatus'
                    type: array
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get user warehouse credentials
      summary: List warehouse credentials
      tags:
      - My Account
      security: []
      parameters: []
    post:
      operationId: createWarehouseCredentials
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/UserWarehouseCredentials'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create user warehouse credentials
      summary: Create warehouse credentials
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserWarehouseCredentials'
  /api/v1/user/warehouseCredentials/redshift/aws-sso/start:
    post:
      operationId: startRedshiftAwsSsoWarehouseCredentials
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedshiftAwsSsoStartResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Start Redshift AWS SSO login
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedshiftAwsSsoStartRequest'
  /api/v1/user/warehouseCredentials/redshift/aws-sso/complete:
    post:
      operationId: completeRedshiftAwsSsoWarehouseCredentials
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedshiftAwsSsoCompleteResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Complete Redshift AWS SSO login
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedshiftAwsSsoCompleteRequest'
  /api/v1/user/warehouseCredentials/{uuid}:
    patch:
      operationId: updateWarehouseCredentials
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/UserWarehouseCredentials'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Update user warehouse credentials
      summary: Update warehouse credentials
      tags:
      - My Account
      security: []
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserWarehouseCredentials'
    delete:
      operationId: deleteWarehouseCredentials
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Delete user warehouse credentials
      summary: Delete warehouse credentials
      tags:
      - My Account
      security: []
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
  /api/v1/user/login-options:
    get:
      operationId: getLoginOptions
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetLoginOptionsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Get login options
      tags:
      - My Account
      security: []
      parameters:
      - in: query
        name: email
        required: false
        schema:
          type: string
      - in: query
        name: mobile_login_intent
        required: false
        schema:
          type: string
      - in: query
        name: mobilePlatform
        required: false
        schema:
          type: string
  /api/v1/user/login-email-otp:
    post:
      operationId: LoginEmailOtp
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLoginEmailOtpResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiLoginEmailOtpRequest'
      summary: Login email otp
      x-summary-source: derived
  /api/v1/user/login-email-otp/verify:
    post:
      operationId: VerifyLoginEmailOtp
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVerifyLoginEmailOtpResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiVerifyLoginEmailOtpRequest'
      summary: Verify login email otp
      x-summary-source: derived
  /api/v1/user/me/personal-access-tokens:
    get:
      operationId: GetPersonalAccessTokens
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    items:
                      $ref: '#/components/schemas/PersonalAccessToken'
                    type: array
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: List personal access tokens
      tags:
      - My Account
      security: []
      parameters: []
      x-operation-id-source: normalized
      x-operation-id-original: Get personal access tokens
    post:
      operationId: CreatePersonalAccessToken
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/PersonalAccessTokenWithToken'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Create personal access token
      tags:
      - My Account
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalAccessToken'
      x-operation-id-source: normalized
      x-operation-id-original: Create personal access token
  /api/v1/user/me/personal-access-tokens/{personalAccessTokenUuid}:
    delete:
      operationId: DeletePersonalAccessToken
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Delete personal access token
      tags:
      - My Account
      security: []
      parameters:
      - in: path
        name: personalAccessTokenUuid
        required: true
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: Delete personal access token
  /api/v1/user/me/personal-access-tokens/{personalAccessTokenUuid}/rotate:
    patch:
      operationId: RotatePersonalAccessToken
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  results:
                    $ref: '#/components/schemas/PersonalAccessTokenWithToken'
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - results
                - status
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Rotate personal access token
      tags:
      - My Account
      security: []
      parameters:
      - in: path
        name: personalAccessTokenUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                expiresAt:
                  type: string
                  format: date-time
              required:
              - expiresAt
              type: object
      x-operation-id-source: normalized
      x-operation-id-original: Rotate personal access token
  /api/v1/user/account:
    get:
      operationId: GetAccount
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetAccountResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get account information
      summary: Get account
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/user/me/avatar:
    put:
      operationId: UpdateMyAvatar
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAvatarResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Upload a profile avatar. Send raw image bytes as the body with an

        image/png, image/jpeg or image/webp Content-Type. The image is

        center-cropped, resized and re-encoded server-side.'
      summary: Upload avatar
      tags:
      - My Account
      security: []
      parameters: []
    delete:
      operationId: DeleteMyAvatar
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove the current user's uploaded avatar.
      summary: Delete avatar
      tags:
      - My Account
      security: []
      parameters: []
  /api/v1/users/{userUuid}/avatar/{contentHash}:
    get:
      operationId: GetUserAvatar
      responses:
        '200':
          description: Success
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Serve a user''s avatar image. Content-addressed by hash, so responses

        are immutable and cached by the browser indefinitely.'
      summary: Get user avatar
      tags:
      - My Account
      security: []
      parameters:
      - in: path
        name: userUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: contentHash
        required: true
        schema:
          type: string
components:
  schemas:
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    ApiGetLoginOptionsResponse:
      properties:
        results:
          $ref: '#/components/schemas/LoginOptions'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    LearnProgress:
      properties:
        lastStarted:
          type:
          - string
          - 'null'
          description: The scope started most recently, for the library's Resume card.
        started:
          items:
            type: string
          type: array
          description: Scopes whose walkthrough was started at least once.
        completed:
          items:
            type: string
          type: array
          description: Scopes whose walkthrough was finished (Got it on the last step).
      required:
      - lastStarted
      - started
      - completed
      type: object
      description: 'What a learner has done with Learn walkthroughs, kept on the instance per

        user (CS-186) so the library shows the same thing from any browser.'
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    Pick_CreatePostgresCredentials-or-CreateTrinoCredentials-or-CreateClickhouseCredentials.type-or-user_:
      properties:
        type:
          anyOf:
          - $ref: '#/components/schemas/WarehouseTypes.POSTGRES'
          - $ref: '#/components/schemas/WarehouseTypes.TRINO'
          - $ref: '#/components/schemas/WarehouseTypes.CLICKHOUSE'
        user:
          type: string
      required:
      - type
      - user
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    WarehouseTypes.CLICKHOUSE:
      enum:
      - clickhouse
      type: string
    MeshColor:
      type: string
    OrganizationMemberRole:
      enum:
      - member
      - viewer
      - interactive_viewer
      - editor
      - developer
      - admin
      type: string
    RedshiftAwsSsoCompleteResponse:
      properties:
        results:
          $ref: '#/components/schemas/RedshiftAwsSsoCompleteResults'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    ApiVerifyLoginEmailOtpResponse:
      properties:
        results:
          $ref: '#/components/schemas/LightdashUser'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    RedshiftAwsSsoCompleteRequest:
      properties:
        databaseUser:
          type: string
        credentialsName:
          type: string
        projectName:
          type: string
        projectUuid:
          type: string
        roleName:
          type: string
        accountId:
          type: string
      type: object
    PersonalAccessTokenWithToken:
      allOf:
      - $ref: '#/components/schemas/PersonalAccessToken'
