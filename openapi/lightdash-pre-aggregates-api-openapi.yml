openapi: 3.2.0
info:
  title: Lightdash Pre Aggregates API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Pre-Aggregates
paths:
  /api/v2/projects/{projectUuid}/pre-aggregates/stats:
    get:
      operationId: getPreAggregateStats
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetPreAggregateStatsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Retrieves aggregated pre-aggregate hit/miss statistics for a project
      summary: Get pre-aggregate stats
      tags:
      - Pre-Aggregates
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: query
        name: days
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: exploreName
        required: false
        schema:
          type: string
      - in: query
        name: queryType
        required: false
        schema:
          type: string
          enum:
          - chart
          - dashboard
          - explorer
  /api/v2/projects/{projectUuid}/pre-aggregates/dashboards/{dashboardUuidOrSlug}/audit:
    get:
      operationId: getDashboardPreAggregateAudit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetDashboardPreAggregateAuditResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Audits pre-aggregate hit/miss coverage for every tile on a dashboard

        without executing the queries. Returns a per-tile breakdown grouped

        by tab, suitable for CI coverage checks and pre-aggregate tuning.'
      summary: Get dashboard pre-aggregate audit
      tags:
      - Pre-Aggregates
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: dashboardUuidOrSlug
        required: true
        schema:
          type: string
    post:
      operationId: runDashboardPreAggregateAudit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetDashboardPreAggregateAuditResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Audit pre-aggregate hit/miss coverage with runtime filter overrides
      summary: Run dashboard pre-aggregate audit
      tags:
      - Pre-Aggregates
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: path
        name: dashboardUuidOrSlug
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRunDashboardPreAggregateAuditBody'
  /api/v2/projects/{projectUuid}/pre-aggregates/materializations:
    get:
      operationId: getPreAggregateMaterializations
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetPreAggregateMaterializationsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Retrieves pre-aggregate definitions with their latest materialization status
      summary: Get pre-aggregate materializations
      tags:
      - Pre-Aggregates
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
components:
  schemas:
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    PreAggregateMissReason.EXPLORE_RESOLUTION_ERROR:
      enum:
      - explore_resolution_error
      type: string
    PreAggregateMaterializationSummary:
      properties:
        materialization:
          properties:
            trigger:
              $ref: '#/components/schemas/PreAggregateMaterializationTrigger'
            errorMessage:
              type:
              - string
              - 'null'
            totalBytes:
              type:
              - number
              - 'null'
              format: double
            columns:
              allOf:
              - $ref: '#/components/schemas/ResultColumns'
            rowCount:
              type:
              - number
              - 'null'
              format: double
            durationMs:
              type:
              - number
              - 'null'
              format: double
            materializedAt:
              type:
              - string
              - 'null'
              format: date-time
            status:
              $ref: '#/components/schemas/PreAggregateMaterializationStatus'
            materializationUuid:
              type: string
          required:
          - trigger
          - errorMessage
          - totalBytes
          - columns
          - rowCount
          - durationMs
          - materializedAt
          - status
          - materializationUuid
          type:
          - object
          - 'null'
        warnings:
          items:
            $ref: '#/components/schemas/PreAggregateMaterializationWarning'
          type: array
        resolvedMaxRows:
          type:
          - number
          - 'null'
          format: double
        definitionError:
          type:
          - string
          - 'null'
        refreshCron:
          type:
          - string
          - 'null'
        granularity:
          allOf:
          - $ref: '#/components/schemas/TimeFrames'
        timeDimension:
          type:
          - string
          - 'null'
        filters:
          items:
            $ref: '#/components/schemas/MetricFilterRule'
          type: array
        metrics:
          items:
            type: string
          type: array
        dimensions:
          items:
            type: string
          type: array
        materializationRole:
          allOf:
          - $ref: '#/components/schemas/PreAggregateMaterializationRole'
        sourceExploreName:
          type: string
        preAggExploreName:
          type: string
        externalTable:
          type:
          - string
          - 'null'
        preAggregateName:
          type: string
        preAggregateDefinitionUuid:
          type: string
      required:
      - materialization
      - warnings
      - resolvedMaxRows
      - definitionError
      - refreshCron
      - granularity
      - timeDimension
      - filters
      - metrics
      - dimensions
      - materializationRole
      - sourceExploreName
      - preAggExploreName
      - externalTable
      - preAggregateName
      - preAggregateDefinitionUuid
      type: object
    ApiRunDashboardPreAggregateAuditBody:
      properties:
        dashboardFilters:
          $ref: '#/components/schemas/DashboardFilters'
      type: object
    ApiPreAggregateMaterializationsResults:
      properties:
        materializations:
          items:
            $ref: '#/components/schemas/PreAggregateMaterializationSummary'
          type: array
      required:
      - materializations
      type: object
    KnexPaginateArgs:
      properties:
        page:
          type: number
          format: double
        pageSize:
          type: number
          format: double
      required:
      - page
      - pageSize
      type: object
    UserAttributeValueMap:
      $ref: '#/components/schemas/Record_string.string-Array_'
    ApiGetPreAggregateStatsResponse:
      properties:
        results:
          $ref: '#/components/schemas/KnexPaginatedData_ApiPreAggregateStatsResults_'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    KnexPaginatedData_ApiPreAggregateMaterializationsResults_:
      properties:
        pagination:
          allOf:
          - $ref: '#/components/schemas/KnexPaginateArgs'
          - properties:
              totalResults:
                type: number
                format: double
              totalPageCount:
                type: number
                format: double
            required:
            - totalResults
            - totalPageCount
            type: object
        data:
          $ref: '#/components/schemas/ApiPreAggregateMaterializationsResults'
      required:
      - data
      type: object
    PreAggregateDailyStatResult:
      properties:
        updatedAt:
          type: string
        preAggregateName:
          type:
          - string
          - 'null'
        missReason:
          type:
          - string
          - 'null'
        fallbackCount:
          type: number
          format: double
        missCount:
          type: number
          format: double
        hitCount:
          type: number
          format: double
        queryContext:
          type: string
        dashboardSlug:
          type:
          - string
          - 'null'
        dashboardName:
          type:
          - string
          - 'null'
        dashboardUuid:
          type:
          - string
          - 'null'
        chartName:
          type:
          - string
          - 'null'
        chartUuid:
          type:
          - string
          - 'null'
        date:
          type: string
        exploreName:
          type: string
      required:
      - updatedAt
      - preAggregateName
      - missReason
      - fallbackCount
      - missCount
      - hitCount
      - queryContext
      - dashboardSlug
      - dashboardName
      - dashboardUuid
      - chartName
      - chartUuid
      - date
      - exploreName
      type: object
    DashboardTileTypes:
      enum:
      - saved_chart
      - sql_chart
      - markdown
      - loom
      - heading
      - data_app
      type: string
    DashboardTileTypes.SAVED_CHART:
      enum:
      - saved_chart
      type: string
    PreAggregateMissReason.NO_PRE_AGGREGATES_DEFINED:
      enum:
      - no_pre_aggregates_defined
      type: string
    FilterOperator:
      enum:
      - isNull
      - notNull
      - equals
      - notEquals
      - startsWith
      - endsWith
      - include
      - doesNotInclude
      - lessThan
      - lessThanOrEqual
      - greaterThan
      - greaterThanOrEqual
      - inThePast
      - notInThePast
      - inTheNext
      - inTheCurrent
      - notInTheCurrent
      - inBetween
      - notInBetween
      - inPeriodToDate
      type: string
    KnexPaginatedData_ApiPreAggregateStatsResults_:
      properties:
        pagination:
          allOf:
          - $ref: '#/components/schemas/KnexPaginateArgs'
          - properties:
              totalResults:
                type: number
                format: double
              totalPageCount:
                type: number
                format: double
            required:
            - totalResults
            - totalPageCount
            type: object
        data:
          $ref: '#/components/schemas/ApiPreAggregateStatsResults'
      required:
      - data
      type: object
    TilePreAggregateAuditMiss:
      properties:
        missFieldLabel:
          type:
          - string
          - 'null'
        miss:
          $ref: '#/components/schemas/PreAggregateMatchMiss'
        exploreLabel:
          type: string
        exploreName:
          type: string
        chartName:
          type: string
        savedChartUuid:
          type: string
        tileType:
          $ref: '#/components/schemas/DashboardTileTypes.SAVED_CHART'
        tileName:
          type: string
        tileUuid:
          type: string
        status:
          type: string
          enum:
          - miss
      required:
      - missFieldLabel
      - miss
      - exploreLabel
      - exploreName
      - chartName
      - savedChartUuid
      - tileType
      - tileName
      - tileUuid
      - status
      type: object
    PreAggregateMissReason.DEDUPLICATED_METRIC_REQUIRES_EXACT_MATCH:
      enum:
      - deduplicated_metric_requires_exact_match
      type: string
    PreAggregateMatchMiss:
      anyOf:
      - properties:
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.NO_PRE_AGGREGATES_DEFINED'
        required:
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.DIMENSION_NOT_IN_PRE_AGGREGATE'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.METRIC_NOT_IN_PRE_AGGREGATE'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.NON_ADDITIVE_METRIC'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.NON_ADDITIVE_METRIC_REQUIRES_EXACT_MATCH'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.DEDUPLICATED_METRIC_REQUIRES_EXACT_MATCH'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.CUSTOM_SQL_METRIC'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.FILTER_DIMENSION_NOT_IN_PRE_AGGREGATE'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.SQL_FILTER_FIELD_NOT_IN_PRE_AGGREGATE'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.PRE_AGGREGATE_FILTER_NOT_SATISFIED'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          preAggregateTimeDimension:
            type: string
          preAggregateGranularity:
            $ref: '#/components/schemas/TimeFrames'
          queryGranularity:
            $ref: '#/components/schemas/TimeFrames'
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.GRANULARITY_TOO_FINE'
        required:
        - preAggregateTimeDimension
        - preAggregateGranularity
        - queryGranularity
        - fieldId
        - reason
        type: object
      - properties:
          preAggregateTimeDimension:
            type: string
          preAggregateGranularity:
            $ref: '#/components/schemas/TimeFrames'
          queryGranularity:
            $ref: '#/components/schemas/TimeFrames'
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.TIME_FRAME_NOT_DERIVABLE'
        required:
        - preAggregateTimeDimension
        - preAggregateGranularity
        - queryGranularity
        - fieldId
        - reason
        type: object
      - properties:
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.CUSTOM_DIMENSION_PRESENT'
        required:
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.CUSTOM_METRIC_PRESENT'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          fieldId:
            $ref: '#/components/schemas/FieldId'
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.TABLE_CALCULATION_PRESENT'
        required:
        - fieldId
        - reason
        type: object
      - properties:
          preAggregateName:
            type: string
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.USER_BYPASS'
        required:
        - preAggregateName
        - reason
        type: object
      - properties:
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.EXPLORE_RESOLUTION_ERROR'
        required:
        - reason
        type: object
      - properties:
          reason:
            $ref: '#/components/schemas/PreAggregateMissReason.NO_ACTIVE_MATERIALIZATION'
        required:
        - reason
        type: object
    TabAuditGroup:
      properties:
        tiles:
          items:
            $ref: '#/components/schemas/TilePreAggregateAuditStatus'
          type: array
        tabName:
          type:
          - string
          - 'null'
        tabUuid:
          type:
          - string
          - 'null'
      required:
      - tiles
      - tabName
      - tabUuid
      type: object
    MetricFilterRule:
      description: Filter rule for metrics, targeting fields by reference
      properties:
        includeNull:
          type: boolean
          description: 'For the `equals` operator on string fields, also match rows where the

            field is null (compiles to `field IN (...) OR field IS NULL`). Lets users

            combine null with selected values in a single "is" rule.'
        values:
          items:
            $ref: '#/components/schemas/AnyType'
          type: array
          description: Values to filter by
        operator:
          $ref: '#/components/schemas/FilterOperator'
          description: Filter operator
        id:
          type: string
          description: Unique identifier for the filter
        target:
          properties:
            fieldRef:
              type: string
              description: Field reference to filter on (e.g., 'table_name.field_name')
          required:
          - fieldRef
          type: object
          description: Target field for the filter
        settings:
          $ref: '#/components/schemas/AnyType'
          description: Additional settings for date/time filters
        disabled:
          type: boolean
          description: Whether this filter is disabled
        required:
          type: boolean
          description: Whether this filter is required
        caseSensitive:
          type: boolean
          description: 'Overrides the field/explore case-sensitivity for this rule only.

            Used by internal features like autocomplete search that must always

            match case-insensitively regardless of the field''s configured setting.'
      required:
      - operator
      - id
      - target
      type: object
      additionalProperties: true
    FilterRule_FilterOperator.DashboardFieldTarget.AnyType.AnyType_:
      properties:
        includeNull:
          type: boolean
          description: 'For the `equals` operator on string fields, also match rows where the

            field is null (compiles to `field IN (...) OR field IS NULL`). Lets users

            combine null with selected values in a single "is" rule.'
        values:
          items:
            $ref: '#/components/schemas/AnyType'
          type: array
          description: Values to filter by
        operator:
          $ref: '#/components/schemas/FilterOperator'
          description: Filter operator
        id:
          type: string
          description: Unique identifier for the filter
        target:
          $ref: '#/components/schemas/DashboardFieldTarget'
          description: Target field for the filter
        settings:
          $ref: '#/components/schemas/AnyType'
          description: Additional settings for date/time filters
        disabled:
          type: boolean
          description: Whether this filter is disabled
        required:
          type: boolean
          description: Whether this filter is required
        caseSensitive:
          type: boolean
          description: 'Overrides the field/explore case-sensitivity for this rule only.

            Used by internal features like autocomplete search that must always

            match case-insensitively regardless of the field''s configured setting.'
      required:
      - operator
      - id
      - target
      type: object
      additionalProperties: true
    PreAggregateMissReason.NO_ACTIVE_MATERIALIZATION:
      enum:
      - no_active_materialization
      type: string
    PreAggregateMissReason.USER_BYPASS:
      enum:
      - user_bypass
      type: string
    PreAggregateMissReason.FILTER_DIMENSION_NOT_IN_PRE_AGGREGATE:
      enum:
      - filter_dimension_not_in_pre_aggregate
      type: string
    CustomFormat:
      properties:
        type:
          $ref: '#/components/schemas/CustomFormatType'
          description: Format type
        round:
          type: number
          format: double
          description: Number of decimal places
        separator:
          $ref: '#/components/schemas/NumberSeparator'
          description: Number separator style
        currency:
          type: string
          description: Currency code (e.g., USD, GBP, EUR)
        compact:
          $ref: '#/components/schemas/CompactOrAlias'
          description: Compact format for large numbers (K, M, B, T) or byte units
        prefix:
          type: string
          description: Prefix to prepend to formatted values
        suffix:
          type: string
          description: Suffix to append to formatted values
        timeInterval:
          $ref: '#/components/schemas/TimeFrames'
          description: Time interval for date formatting
        custom:
          type: string
          description: Custom format string
      required:
      - type
      type: object
      additionalProperties: true
    PreAggregateMissReason.METRIC_NOT_IN_PRE_AGGREGATE:
      enum:
      - metric_not_in_pre_aggregate
      type: string
    TilePreAggregateAuditStatus:
      anyOf:
      - $ref: '#/components/schemas/TilePreAggregateAuditHit'
      - $ref: '#/components/schemas/TilePreAggregateAuditMiss'
      - $ref: '#/components/schemas/TilePreAggregateAuditIneligible'
    PreAggregateMissReason.CUSTOM_METRIC_PRESENT:
      enum:
      - custom_metric_present
      type: string
    TileIneligibleReason:
      enum:
      - non_chart_tile
      - sql_chart
      - orphaned_chart
      - explore_resolution_error
      type: string
    DashboardPreAggregateAuditSummary:
      properties:
        ineligibleCount:
          type: number
          format: double
        missCount:
          type: number
          format: double
        hitCount:
          type: number
          format: double
      required:
      - ineligibleCount
      - missCount
      - hitCount
      type: object
    ApiGetDashboardPreAggregateAuditResponse:
      properties:
        results:
          $ref: '#/components/schemas/DashboardPreAggregateAudit'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    ResultColumn:
      properties:
        provenance:
          $ref: '#/components/schemas/ResultColumnProvenance'
          description: 'Absent ⇒ no semantic field behind this column (computed DuckDB column,

            raw SQL column, table calc, join key). Absence gates interaction

            capabilities (drill, underlying data, URLs) off — by design.'
        shiftsTimezone:
          type: boolean
          description: 'Resolved output of getFormatterTimezone: whether values shift into the

            display timezone. Saves consumers from needing skipTimezoneConversion /

            baseDimensionType.'
        timeInterval:
          $ref: '#/components/schemas/TimeFrames'
          description: 'Temporal grain. Required for QUARTER (no ECMA-376 token) and for

            export paths (GSheets) that branch on grain.'
        formatOptions:
          $ref: '#/components/schemas/CustomFormat'
          description: 'Escape hatch for the non-expressible formats: Compact.AUTO and

            negative round (magnitude rounding). Mirrors getFieldFormatOverrideProps.'
        separator:
          $ref: '#/components/schemas/NumberSeparator'
          description: 'The expression cannot encode locale — carried beside it, mirroring

            Field.separator / getFieldFormatOverrideProps.'
        format:
          type: string
          description: 'Lightdash format expression: ECMA-376 with in-repo extensions (IEC

            bytes, tz-shift for date expressions). MUST be rendered with

            formatValueWithExpression, never raw numfmt.'
        label:
          type: string
          description: Display label. Absent ⇒ consumers fall back to the reference.
        numericKind:
          $ref: '#/components/schemas/ResultNumericKind'
          description: NUMBER columns only, when the driver reports it. Absent ⇒ unknown, read as DOUBLE.
        type:
          $ref: '#/components/schemas/DimensionType'
        reference:
          type: string
      required:
      - type
      - reference
      type: object
    CustomFormatType:
      enum:
      - default
      - percent
      - currency
      - number
      - id
      - date
      - timestamp
      - bytes_si
