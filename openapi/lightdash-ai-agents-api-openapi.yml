components:
  schemas:
    AiAgentSkillIssue:
      properties:
        path:
          type: string
          description: File or folder path inside the skill folder the issue refers to.
        message:
          type: string
        code:
          $ref: '#/components/schemas/AiAgentSkillIssueCode'
      required:
      - path
      - message
      - code
      type: object
    Record_string.never_:
      properties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    AiAgentSkillVersion:
      allOf:
      - $ref: '#/components/schemas/AiAgentSkillVersionSummary'
      - properties:
          content:
            $ref: '#/components/schemas/AiAgentSkillContent'
          skillUuid:
            type: string
        required:
        - content
        - skillUuid
        type: object
    ApiAiAgentThreadDumpResponse:
      $ref: '#/components/schemas/ApiSuccess_AiAgentThreadDump_'
    ApiSkillsAsCodeListResponse:
      properties:
        results:
          properties:
            missingNames:
              items:
                type: string
              type: array
            skills:
              items:
                $ref: '#/components/schemas/SkillAsCode'
              type: array
          required:
          - missingNames
          - skills
          type: object
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    AiAgentAdminSortField:
      type: string
      enum:
      - createdAt
      - title
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    ApiAiReviewLinearRoutingResponse:
      $ref: '#/components/schemas/ApiSuccess_AiReviewLinearRouting_'
    McpActivitySummary:
      properties:
        toolCalls:
          items:
            $ref: '#/components/schemas/McpActivityItem'
          type: array
      required:
      - toolCalls
      type: object
    McpActivityDirection:
      type: string
      enum:
      - inbound
      - outbound
      description: '`inbound`: an external MCP client (Claude, Cursor, ...) called a tool on

        Lightdash''s MCP server. `outbound`: a Lightdash agent called a tool on a

        connected external MCP server during a conversation.'
    ApiSuccess_AiReviewJiraDestination_:
      properties:
        results:
          $ref: '#/components/schemas/AiReviewJiraDestination'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    AiAgentConfigurationSetting:
      type: string
      enum:
      - instructions
      - knowledge_documents
      - data_access
      - self_improvement
      - sql_mode
      - mcp_servers
      - explore_tags
      - space_access
      - user_or_group_access
      - skills
      - unknown
    AiAgentThreadDumpTurn:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/AiAgentThreadDumpArtifact'
          type: array
        toolCalls:
          items:
            $ref: '#/components/schemas/AiAgentThreadDumpToolCall'
          type: array
        tokenUsage:
          allOf:
          - $ref: '#/components/schemas/AiPromptTokenUsage'
        modelConfig:
          properties:
            modelProvider:
              type: string
            modelName:
              type: string
          required:
          - modelProvider
          - modelName
          type:
          - object
          - 'null'
        steers:
          items:
            type: string
          type: array
        feedback:
          properties:
            comment:
              type:
              - string
              - 'null'
            score:
              type: number
              format: double
          required:
          - comment
          - score
          type:
          - object
          - 'null'
        interrupted:
          type: boolean
        error:
          type:
          - string
          - 'null'
        assistant:
          type:
          - string
          - 'null'
        user:
          type: string
        hidden:
          type: boolean
        respondedAt:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        promptUuid:
          type: string
      required:
      - artifacts
      - toolCalls
      - tokenUsage
      - modelConfig
      - steers
      - feedback
      - interrupted
      - error
      - assistant
      - user
      - hidden
      - respondedAt
      - createdAt
      - promptUuid
      type: object
    Record_ByoAiApiKeyProvider.string-or-null_:
      properties:
        anthropic:
          type:
          - string
          - 'null'
        google:
          type:
          - string
          - 'null'
        openai:
          type:
          - string
          - 'null'
      required:
      - anthropic
      - google
      - openai
      type: object
      description: Construct a type with a set of properties K of type T
    ApiUpdateAiOrganizationSettingsResponse:
      $ref: '#/components/schemas/ApiSuccess_AiOrganizationSettings_'
    AiProviderApiKeyHints:
      $ref: '#/components/schemas/Record_ByoAiProvider.string-or-null_'
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    AiAgentThreadDump:
      properties:
        turns:
          items:
            $ref: '#/components/schemas/AiAgentThreadDumpTurn'
          type: array
        agent:
          allOf:
          - $ref: '#/components/schemas/AiAgentThreadDumpAgent'
        title:
          type:
          - string
          - 'null'
        createdFrom:
          $ref: '#/components/schemas/AiThreadCreatedFrom'
        userUuid:
          type:
          - string
