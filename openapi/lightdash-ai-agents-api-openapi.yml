openapi: 3.2.0
info:
  title: Lightdash AI Agents API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: AI Agents
paths:
  /api/v1/aiAgents/skills:
    get:
      operationId: listAiAgentSkills
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillSummaryListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'List the organization''s custom skills. With a project, returns the

        organization-wide skills plus the ones scoped to that project. Deleted

        skills are included on request so one of their versions can be restored.'
      summary: List AI agent skills
      security: []
      parameters:
      - in: query
        name: projectUuid
        required: false
        schema:
          type: string
      - in: query
        name: includeDeleted
        required: false
        schema:
          type: boolean
      tags:
      - AI Agents
    post:
      operationId: createAiAgentSkill
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create a custom skill from its files and publish version 1.
      summary: Create an AI agent skill
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateAiAgentSkill'
      tags:
      - AI Agents
  /api/v1/aiAgents/skills/code:
    get:
      operationId: getAiAgentSkillsAsCode
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSkillsAsCodeListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Download skills as code: each skill''s `SKILL.md` and resources, keyed

        by path. Names filter the set; missing names are reported.'
      summary: Download AI agent skills as code
      security: []
      parameters:
      - in: query
        name: names
        required: false
        schema:
          type: array
          items:
            type: string
      tags:
      - AI Agents
    post:
      operationId: upsertAiAgentSkillsAsCode
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSkillsAsCodeUpsertResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Upload skills as code. Creates new skills, publishes a version for

        changed ones, reports unchanged ones, and soft-deletes only the names

        listed in `deleteNames`.'
      summary: Upload AI agent skills as code
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSkillsAsCodeUpsertRequest'
      tags:
      - AI Agents
  /api/v1/aiAgents/skills/validate:
    post:
      operationId: validateAiAgentSkill
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillValidationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Validate a skill folder without saving it. Returns the same errors and

        warnings the editor and the CLI show.'
      summary: Validate an AI agent skill
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiValidateAiAgentSkill'
      tags:
      - AI Agents
  /api/v1/aiAgents/skills/{skillUuid}:
    get:
      operationId: getAiAgentSkill
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'The skill with its current content and parsed frontmatter. Deleted

        skills are returned too, so their history stays reachable.'
      summary: Get an AI agent skill
      security: []
      parameters:
      - in: path
        name: skillUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - AI Agents
    patch:
      operationId: updateAiAgentSkill
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Save the skill's files. Publishes a new version when the content changed.
      summary: Update an AI agent skill
      security: []
      parameters:
      - in: path
        name: skillUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiUpdateAiAgentSkill'
      tags:
      - AI Agents
    delete:
      operationId: deleteAiAgentSkill
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillDeleteResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Soft-delete the skill and unbind it from every agent. Returns the

        agents that lost it.'
      summary: Delete an AI agent skill
      security: []
      parameters:
      - in: path
        name: skillUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - AI Agents
  /api/v1/aiAgents/skills/{skillUuid}/versions:
    get:
      operationId: listAiAgentSkillVersions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillVersionListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Every version of the skill, newest first, without content.
      summary: List an AI agent skill's versions
      security: []
      parameters:
      - in: path
        name: skillUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - AI Agents
  /api/v1/aiAgents/skills/{skillUuid}/versions/{versionNumber}:
    get:
      operationId: getAiAgentSkillVersion
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillVersionResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: One version of the skill with its full content.
      summary: Get one version of an AI agent skill
      security: []
      parameters:
      - in: path
        name: skillUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: versionNumber
        required: true
        schema:
          format: double
          type: number
      tags:
      - AI Agents
  /api/v1/aiAgents/skills/{skillUuid}/versions/{versionNumber}/restore:
    post:
      operationId: restoreAiAgentSkillVersion
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSkillResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Publish a new version whose content equals the chosen one. Also

        restores a soft-deleted skill.'
      summary: Restore a version of an AI agent skill
      security: []
      parameters:
      - in: path
        name: skillUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: versionNumber
        required: true
        schema:
          format: double
          type: number
      tags:
      - AI Agents
  /api/v1/aiAgents/documents:
    get:
      operationId: listAiAgentDocuments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentDocumentSummaryListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: List every knowledge document in the organization.
      summary: List AI agent documents
      security: []
      parameters:
      - in: query
        name: projectUuid
        required: false
        schema:
          type: string
      tags:
      - AI Agents
    post:
      operationId: createAiAgentDocument
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Create a knowledge document. The projectUuid and agentAccess body fields

        are deprecated: scope the document by creating it on the agent route

        instead. Without them the document is available to every agent.'
      summary: Create AI agent document
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateAiAgentDocument'
      tags:
      - AI Agents
  /api/v1/aiAgents/documents/{documentUuid}:
    delete:
      operationId: deleteAiAgentDocument
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Delete a knowledge document anywhere in the organization.
      summary: Delete AI agent document
      security: []
      parameters:
      - in: path
        name: documentUuid
        required: true
        schema:
          type: string
      tags:
      - AI Agents
  /api/v1/aiAgents/settings:
    get:
      operationId: getAiOrganizationRuntimeSettings
      responses:
        '200':
          description: Retrieved AI organization runtime settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiOrganizationRuntimeSettingsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      security: []
      parameters: []
      tags:
      - AI Agents
      summary: Get ai organization runtime settings
      x-summary-source: derived
  /api/v1/aiAgents/admin/threads:
    get:
      operationId: getAllThreads
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentAdminConversationsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get all AI agent threads for admin
      summary: List AI agent threads
      security: []
      parameters:
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: projectUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: agentUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: userUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: createdFrom
        required: false
        schema:
          $ref: '#/components/schemas/AiThreadCreatedFrom'
      - in: query
        name: humanScore
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: dateFrom
        required: false
        schema:
          type: string
      - in: query
        name: dateTo
        required: false
        schema:
          type: string
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: sortField
        required: false
        schema:
          $ref: '#/components/schemas/AiAgentAdminSortField'
      - in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/threads/{threadUuid}/dump:
    get:
      operationId: getAdminThreadDump
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentThreadDumpResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Download a sanitized debug dump of an AI agent thread for troubleshooting.

        Requires AI_COPILOT_THREAD_DUMP_ENABLED on the instance.'
      summary: Get AI agent thread dump
      security: []
      parameters:
      - in: path
        name: threadUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/threads/{threadUuid}:
    delete:
      operationId: deleteAdminAiAgentThread
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Permanently delete an AI agent thread and everything derived from it.
      summary: Delete AI agent thread
      security: []
      parameters:
      - in: path
        name: threadUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/evals:
    get:
      operationId: getAllEvals
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentAdminEvalsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get all AI agent evaluations for admin
      summary: List AI agent evaluations
      security: []
      parameters:
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: projectUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: agentUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: sortField
        required: false
        schema:
          $ref: '#/components/schemas/AiAgentAdminSortField'
      - in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/evals/{evalUuid}/prompts:
    get:
      operationId: getAdminEvalPrompts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentAdminEvalPromptsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get the prompts of an AI agent evaluation for admin
      summary: List AI agent evaluation prompts
      security: []
      parameters:
      - in: path
        name: evalUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/mcp-activity:
    get:
      operationId: getMcpActivity
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMcpActivityResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get MCP tool call activity for admin
      summary: List MCP activity
      security: []
      parameters:
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: projectUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: userUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: agentUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: toolNames
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: clientNames
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/McpActivityStatus'
      - in: query
        name: dateFrom
        required: false
        schema:
          type: string
      - in: query
        name: dateTo
        required: false
        schema:
          type: string
      - in: query
        name: sortField
        required: false
        schema:
          $ref: '#/components/schemas/McpActivitySortField'
      - in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/mcp-activity/stats:
    get:
      operationId: getMcpActivityStats
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMcpActivityStatsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get aggregated MCP tool call stats for admin
      summary: Get MCP activity stats
      security: []
      parameters:
      - in: query
        name: projectUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: userUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: agentUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: toolNames
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: clientNames
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: dateFrom
        required: false
        schema:
          type: string
      - in: query
        name: dateTo
        required: false
        schema:
          type: string
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/projects/{projectUuid}/prompt-activity:
    get:
      operationId: getProjectPromptActivity
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentAdminPromptActivityResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get prompt activity for one project
      summary: Get project AI agent prompt activity
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          type: string
      - in: query
        name: days
        required: false
        schema:
          default: 30
          format: double
          type: number
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/agents:
    get:
      operationId: getAllAgents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentSummaryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get all AI agents for admin
      summary: List AI agents
      security: []
      parameters: []
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/memories:
    get:
      operationId: getAllAiAgentMemories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentAdminMemoriesResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get all AI agent memories for admin
      summary: List AI agent memories
      security: []
      parameters:
      - in: query
        name: page
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: projectUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: userUuids
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: statuses
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AiAgentMemoryStatus'
      - in: query
        name: scopes
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AiAgentMemoryScope'
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: sortField
        required: false
        schema:
          $ref: '#/components/schemas/AiAgentAdminMemorySortField'
      - in: query
        name: sortDirection
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      tags:
      - AI Agents
  /api/v1/aiAgents/admin/review-items:
    get:
      operationId: getAiAgentReviewItems
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentReviewItemsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get AI agent classifier review items for admin
      summary: List AI agent review items
      security: []
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AiAgentReviewItemStatus'
      tags:
      - AI Agents
    post:
      operationId: createAiAgentReviewItem
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAiAgentReviewItemResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Create a manual AI agent issue
      summary: Create AI agent review item
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiAgentReviewItem'
