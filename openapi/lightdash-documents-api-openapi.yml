openapi: 3.2.0
info:
  title: Lightdash Documents API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Documents
paths:
  /api/v1/projects/{projectUuid}/documents/{documentUuid}/charts/{chartId}/query:
    post:
      operationId: ExecuteDocumentChartQuery
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentChartQueryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: chartId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteDocumentChartQueryRequest'
      summary: Execute document chart query
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuidOrSlug}/pinning:
    patch:
      operationId: ToggleDocumentPin
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTogglePinnedItem'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
      summary: Toggle document pin
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuid}/verification:
    post:
      operationId: VerifyDocument
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentVerificationResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Verify a Document
      summary: Verify Document
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
    delete:
      operationId: UnverifyDocument
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiContentVerificationDeleteResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove verification from a Document
      summary: Unverify Document
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/projects/{projectUuid}/documents:
    post:
      operationId: CreateDocument
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      summary: Create document
      x-summary-source: derived
    get:
      operationId: ListDocuments
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: limit
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: offset
        required: false
        schema:
          format: double
          type: number
      summary: List documents
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuidOrSlug}/duplicate:
    post:
      operationId: DuplicateDocument
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateDocumentRequest'
      summary: Duplicate document
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuidOrSlug}/exports/pdf:
    post:
      operationId: ExportDocumentPdf
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiJobScheduledResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Export the Document as a paginated PDF, rendered with your access.

        Poll `GET /api/v1/schedulers/job/{jobId}/status`; the completed job''s

        details hold the file `url` and `numFailures` (charts that failed to load).'
      summary: Export document as PDF
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
  /api/v1/projects/{projectUuid}/documents/{documentUuid}/promoteDiff:
    get:
      operationId: GetDocumentPromotionDiff
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPromotionChangesResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: 'Preview promoting a Document to its upstream project: the spaces, custom

        chart types and Document it would create or update.'
      summary: Get Document promotion diff
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/projects/{projectUuid}/documents/{documentUuid}/promote:
    post:
      operationId: PromoteDocument
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPromoteDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Promote a Document to its upstream project.
      summary: Promote Document
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
  /api/v1/projects/{projectUuid}/documents/{documentUuidOrSlug}:
    patch:
      operationId: UpdateDocumentMetadata
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentMetadataRequest'
      summary: Update document metadata
      x-summary-source: derived
    get:
      operationId: GetDocument
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
      summary: Get document
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuid}/versions:
    post:
      operationId: UpdateDocumentContent
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentContentRequest'
      summary: Update document content
      x-summary-source: derived
    get:
      operationId: ListDocumentVersions
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentVersionListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: limit
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: offset
        required: false
        schema:
          format: double
          type: number
      summary: List document versions
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuid}/versions/{versionUuid}:
    get:
      operationId: GetDocumentVersion
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: versionUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      summary: Get document version
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/{documentUuidOrSlug}/as-code:
    get:
      operationId: GetDocumentAsCode
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentAsCodeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: documentUuidOrSlug
        required: true
        schema:
          $ref: '#/components/schemas/UuidOrSlug'
      summary: Get document as code
      x-summary-source: derived
  /api/v1/projects/{projectUuid}/documents/linking-chart:
    get:
      operationId: ListDocumentsLinkingChart
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDocumentsLinkingChartResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: The Documents you can view whose current version links a saved chart or saved SQL chart
      summary: Documents linking a chart
      tags:
      - Documents
      security: []
      parameters:
      - in: path
        name: projectUuid
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - description: The saved chart; pass this or savedSqlUuid
        in: query
        name: savedChartUuid
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - description: The saved SQL chart; pass this or savedChartUuid
        in: query
        name: savedSqlUuid
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
components:
  schemas:
    TableCalculationTemplateType.PERCENT_OF_COLUMN_TOTAL:
      enum:
      - percent_of_column_total
      type: string
    PreAggregateMissReason.EXPLORE_RESOLUTION_ERROR:
      enum:
      - explore_resolution_error
      type: string
    VizBarChartConfig:
      allOf:
      - $ref: '#/components/schemas/VizBaseConfig'
      - properties:
          display:
            $ref: '#/components/schemas/CartesianChartDisplay'
          fieldConfig:
            $ref: '#/components/schemas/PivotChartLayout'
          type:
            $ref: '#/components/schemas/ChartKind.VERTICAL_BAR'
        required:
        - type
        type: object
    DataAppVizChartConfigAsCode:
      properties:
        config:
          $ref: '#/components/schemas/DataAppVizChartAsCode'
        type:
          $ref: '#/components/schemas/ChartType.DATA_APP_VIZ'
      required:
      - type
      type: object
    FrameBoundary:
      properties:
        offset:
          type: number
          format: double
          description: Offset for PRECEDING/FOLLOWING
        type:
          $ref: '#/components/schemas/FrameBoundaryType'
          description: Boundary type
      required:
      - type
      type: object
    AndFilterGroup:
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with AND logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - and
      - id
      type: object
    DashboardSqlChartTile:
      allOf:
      - $ref: '#/components/schemas/DashboardTileBase'
      - $ref: '#/components/schemas/DashboardSqlChartTileProperties'
    FilterOperator.GREATER_THAN:
      enum:
      - greaterThan
      type: string
    Omit_SavedChart.inheritsFromOrgOrProject-or-access_:
      $ref: '#/components/schemas/Pick_SavedChart.Exclude_keyofSavedChart.inheritsFromOrgOrProject-or-access__'
      description: Construct a type with the properties of T except for those in type K.
    PivotValue:
      properties:
        value:
          description: Pivot value
        field:
          type: string
          description: Pivot field ID
      required:
      - value
      - field
      type: object
    VizBaseConfig:
      properties:
        type:
          $ref: '#/components/schemas/ChartKind'
        metadata:
          properties:
            version:
              type: number
              format: double
          required:
          - version
          type: object
      required:
      - type
      - metadata
      type: object
    DashboardTileTypes.HEADING:
      enum:
      - heading
      type: string
    VizBigNumberConditionalOperator:
      anyOf:
      - $ref: '#/components/schemas/FilterOperator.EQUALS'
      - $ref: '#/components/schemas/FilterOperator.NOT_EQUALS'
      - $ref: '#/components/schemas/FilterOperator.LESS_THAN'
      - $ref: '#/components/schemas/FilterOperator.LESS_THAN_OR_EQUAL'
      - $ref: '#/components/schemas/FilterOperator.GREATER_THAN'
      - $ref: '#/components/schemas/FilterOperator.GREATER_THAN_OR_EQUAL'
      description: Operators a big number threshold can be expressed with.
    OrganizationMemberRole:
      enum:
      - member
      - viewer
      - interactive_viewer
      - editor
      - developer
      - admin
      type: string
    ApiSuccess_DocumentList_:
      properties:
        results:
          $ref: '#/components/schemas/DocumentList'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    Pick_CompiledDimension.name-or-label-or-table_:
      properties: {}
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    MapTileBackground:
      enum:
      - none
      - openstreetmap
      - light
      - dark
      - satellite
      - voyager
      type: string
    SpaceMemberRole:
      enum:
      - viewer
      - editor
      - admin
      type: string
    MarkLineData:
      properties:
        dynamicValue:
          type: string
          enum:
          - average
          description: Dynamic value type
        label:
          properties:
            position:
              type: string
              enum:
              - start
              - middle
              - end
              description: Label position
            formatter:
              type: string
              description: Label formatter
          type: object
          description: Label configuration for this data point
        lineStyle:
          properties:
            color:
              type: string
              description: Line color
          required:
          - color
          type: object
          description: Line style for this data point
        uuid:
          type: string
          description: Unique identifier for this mark line
        type:
          type: string
          description: Point type (e.g., 'average')
        value:
          type: string
          description: Value to display
        name:
          type: string
          description: Name of the reference line
        xAxis:
          type: string
          description: X axis value for vertical line
        yAxis:
          type: string
          description: Y axis value for horizontal line
      required:
      - uuid
      type: object
    PromotedDashboard:
      allOf:
      - $ref: '#/components/schemas/DashboardDAO'
      - properties:
          spacePath:
            type: string
          spaceSlug:
            type: string
        required:
        - spacePath
        - spaceSlug
        type: object
    OrFilterGroup:
      properties:
        or:
          items:
            $ref: '#/components/schemas/FilterGroupItem'
          type: array
          description: Array of filters or nested groups combined with OR logic
        id:
          type: string
          description: Unique identifier for the filter group
      required:
      - or
      - id
      type: object
    DocumentList:
      properties:
        nextOffset:
          type:
          - number
          - 'null'
          format: double
        items:
          items:
            $ref: '#/components/schemas/DocumentSummary'
          type: array
      required:
      - nextOffset
      - items
      type: object
    FunnelChartConfig:
      properties:
        config:
          $ref: '#/components/schemas/FunnelChart'
          description: Chart-type-specific configuration
        type:
          $ref: '#/components/schemas/ChartType.FUNNEL'
          description: Type of chart visualization
      required:
      - type
      type: object
    MapChartType:
      enum:
      - scatter
      - area
      - heatmap
      - hexbin
      type: string
    ApiExecuteAsyncMetricQueryResults:
      allOf:
      - $ref: '#/components/schemas/ApiExecuteAsyncQueryResultsCommon'
      - properties:
          warnings:
            items:
              $ref: '#/components/schemas/QueryWarning'
            type: array
          fields:
            $ref: '#/components/schemas/ItemsMap'
          metricQuery:
            $ref: '#/components/schemas/MetricQuery'
        required:
        - warnings
        - fields
        - metricQuery
        type: object
    FunnelChartLabelPosition:
      enum:
      - inside
      - left
      - right
      - hidden
      type: string
    ApiContentVerificationDeleteResponse:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    ChartKind.LINE:
      enum:
      - line
      type: string
    DashboardTileTarget:
      anyOf:
      - $ref: '#/components/schemas/DashboardFieldTarget'
      - type: boolean
        enum:
        - false
    FrameBoundaryType:
      enum:
      - unbounded_preceding
      - preceding
      - current_row
      - following
      - unbounded_following
      type: string
    ExecuteDocumentChartQueryRequest:
      properties:
        versionUuid:
          type: string
      required:
      - versionUuid
      type: object
    NumberSeparator:
      enum:
      - default
      - commaPeriod
      - spacePeriod
      - periodComma
      - noSeparatorPeriod
      - apostrophePeriod
      type: string
    DateZoomConfig:
      properties:
        tileTargets:
          $ref: '#/components/schemas/Record_string.DateZoomTileTarget_'
        controls:
          items:
            $ref: '#/components/schemas/DateZoomControl'
          type: array
      required:
      - tileTargets
      - controls
      type: object
    FixedNumberBinDimension:
      properties:
        id:
          type: string
          description: Unique identifier for the custom dimension
        name:
          type: string
          description: Display name for the custom dimension
        table:
          type: string
          description: Table this custom dimension belongs to
        type:
          $ref: '#/components/schemas/CustomDimensionType.BIN'
          description: Type of custom dimension (bin or sql)
        dimensionId:
          $ref: '#/components/schemas/FieldId'
          description: Field ID of the parent dimension to bin
        binType:
          $ref: '#/components/schemas/BinType.FIXED_NUMBER'
        binNumber:
          type: number
          format: double
      required:
      - id
      - name
      - table
      - type
      - dimensionId
      - binType
      - binNumber
      type: object
      additionalProperties: true
    AgentActorClaim:
      properties:
        agent_connection_grant:
          allOf:
          - $ref: '#/components/schemas/AgentConnectionGrantRef'
        agent_uuid:
          type:
          - string
          - 'null'
        client_id:
          type:
          - string
          - 'null'
        surface:
          $ref: '#/components/schemas/AgentActorSurface'
        sub:
          type: string
      required:
      - agent_uuid
      - client_id
      - surface
      - sub
      type: object
    Pick_Dimension.formatOptions_:
      properties:
        formatOptions:
          $ref: '#/components/schemas/CustomFormat'
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    FilterGroup:
      anyOf:
      - $ref: '#/components/schemas/OrFilterGroup'
      - $ref: '#/components/schemas/AndFilterGroup'
    Pick_Dashboard.Exclude_keyofDashboard.inheritsFromOrgOrProject-or-access__:
      properties:
        config:
