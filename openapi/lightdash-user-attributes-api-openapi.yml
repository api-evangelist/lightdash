- url: /
tags:
- name: User Attributes
paths:
  /api/v2/orgs/{orgUuid}/code/userAttributes:
    get:
      operationId: GetCodeUserAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAttributeAsCodeListResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - User Attributes
      security: []
      parameters:
      - in: path
        name: orgUuid
        required: true
        schema:
          type: string
      summary: Get code user attributes
      x-summary-source: derived
    post:
      operationId: UpsertCodeUserAttribute
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAttributeAsCodeUpsertResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      tags:
      - User Attributes
      security: []
      parameters:
      - in: path
        name: orgUuid
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAttributeAsCode'
      summary: Upsert code user attribute
      x-summary-source: derived
  /api/v1/org/attributes:
    get:
      operationId: getUserAttributes
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserAttributesResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Get all user attributes
      summary: List user attributes
      tags:
      - User Attributes
      security: []
      parameters: []
    post:
      operationId: createUserAttribute
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateUserAttributeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Creates new user attribute
      summary: Create user attribute
      tags:
      - User Attributes
      security: []
      parameters: []
      requestBody:
        description: the user attribute to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAttribute'
              description: the user attribute to create
  /api/v1/org/attributes/{userAttributeUuid}:
    put:
      operationId: updateUserAttribute
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreateUserAttributeResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Updates a user attribute
      summary: Update user attribute
      tags:
      - User Attributes
      security: []
      parameters:
      - description: the UUID for the group to add the user to
        in: path
        name: userAttributeUuid
        required: true
        schema:
          type: string
      requestBody:
        description: the user attribute to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAttribute'
              description: the user attribute to update
    delete:
      operationId: removeUserAttribute
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Remove a user attribute
      summary: Delete user attribute
      tags:
      - User Attributes
      security: []
      parameters:
      - description: the user attribute UUID to remove
        in: path
        name: userAttributeUuid
        required: true
        schema:
          type: string
