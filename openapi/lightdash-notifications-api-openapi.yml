openapi: 3.2.0
info:
  title: Lightdash Notifications API
  version: 2.616.2
  description: 'Open API documentation for all public Lightdash API endpoints. # Authentication Before you get started, you might need to create a Personal Access Token to authenticate via the API. You can create a token by following this guide: https://docs.lightdash.com/references/personal_tokens'
  license:
    name: MIT
  contact:
    name: Lightdash Support
    email: support@lightdash.com
    url: https://docs.lightdash.com/help-and-contact/contact/contact_info/
servers:
- url: /
tags:
- name: Notifications
paths:
  /api/v1/notifications:
    get:
      operationId: getNotifications
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGetNotifications'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      description: Gets notifications for a user based on the type
      summary: Get notifications
      tags:
      - Notifications
      security: []
      parameters:
      - in: query
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/ApiNotificationResourceType'
  /api/v1/notifications/{notificationId}:
    patch:
      operationId: updateNotification
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEmpty'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorPayload'
      summary: Update notification
      tags:
      - Notifications
      security: []
      parameters:
      - description: the id of the notification
        in: path
        name: notificationId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiNotificationUpdateParams'
components:
  schemas:
    AnyType:
      description: 'This AnyType is an alias for any

        The goal is to make it easier to identify any type in the codebase

        without having to eslint-disable all the time

        These are only used on legacy `any` types, don''t use it for new types.

        This is added on a separate file to avoid circular dependencies.'
    NotificationAiCreditAllowance:
      allOf:
      - $ref: '#/components/schemas/NotificationBase'
      - properties:
          metadata:
            properties:
              periodEnd:
                type: string
              thresholdPercent:
                $ref: '#/components/schemas/AiCreditAllowanceAlertThreshold'
            required:
            - periodEnd
            - thresholdPercent
            type: object
          resourceType:
            $ref: '#/components/schemas/ApiNotificationResourceType.AiCreditAllowance'
        required:
        - metadata
        - resourceType
        type: object
    NotificationDashboardComment:
      allOf:
      - $ref: '#/components/schemas/NotificationBase'
      - properties:
          metadata:
            $ref: '#/components/schemas/NotificationDashboardTileCommentMetadata'
          resourceType:
            $ref: '#/components/schemas/ApiNotificationResourceType.DashboardComments'
        required:
        - resourceType
        type: object
    NotificationDashboardTileCommentMetadata:
      properties:
        dashboardUuid:
          type: string
        dashboardName:
          type: string
        dashboardTileUuid:
          type: string
        dashboardTileName:
          type: string
      required:
      - dashboardUuid
      - dashboardName
      - dashboardTileUuid
      - dashboardTileName
      type: object
      additionalProperties: true
    ApiSuccessEmpty:
      properties:
        results: {}
        status:
          type: string
          enum:
          - ok
      required:
      - status
      type: object
    AiReviewNotificationEvent:
      enum:
      - needs_review
      - assigned
      type: string
    ApiNotificationResourceType:
      enum:
      - dashboardComments
      - aiReview
      - contentReview
      - aiCreditAllowance
      type: string
    NotificationAiReview:
      allOf:
      - $ref: '#/components/schemas/NotificationBase'
      - properties:
          metadata:
            properties:
              searchParams:
                type: string
              count:
                type: number
                format: double
              projectUuid:
                type: string
              rootCause:
                type: string
              title:
                type: string
              event:
                $ref: '#/components/schemas/AiReviewNotificationEvent'
              fingerprint:
                type: string
            required:
            - searchParams
            - count
            - projectUuid
            - rootCause
            - title
            - event
            - fingerprint
            type: object
          resourceType:
            $ref: '#/components/schemas/ApiNotificationResourceType.AiReview'
        required:
        - metadata
        - resourceType
        type: object
    ContentReviewNotificationEvent:
      enum:
      - submitted
      - approved
      - rejected
      type: string
    Notification:
      anyOf:
      - $ref: '#/components/schemas/NotificationDashboardComment'
      - $ref: '#/components/schemas/NotificationAiReview'
      - $ref: '#/components/schemas/NotificationContentReview'
      - $ref: '#/components/schemas/NotificationAiCreditAllowance'
    ApiNotificationUpdateParams:
      $ref: '#/components/schemas/Pick_Notification.viewed_'
    ApiNotificationResourceType.ContentReview:
      enum:
      - contentReview
      type: string
    ContentReviewContentType:
      enum:
      - chart
      - dashboard
      - sql_chart
      - document
      type: string
    ApiGetNotifications:
      properties:
        results:
          $ref: '#/components/schemas/ApiNotificationsResults'
        status:
          type: string
          enum:
          - ok
      required:
      - results
      - status
      type: object
    Pick_Notification.viewed_:
      properties:
        viewed:
          type: boolean
      required:
      - viewed
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ApiNotificationResourceType.AiReview:
      enum:
      - aiReview
      type: string
    ApiNotificationResourceType.AiCreditAllowance:
      enum:
      - aiCreditAllowance
      type: string
    ApiErrorPayload:
      properties:
        error:
          properties:
            data:
              $ref: '#/components/schemas/AnyType'
              description: Optional data containing details of the error
            message:
              type: string
              description: A friendly message summarising the error
            name:
              type: string
              description: Unique name for the type of error
            statusCode:
              type: number
              format: integer
              description: HTTP status code
          required:
          - name
          - statusCode
          type: object
        status:
          type: string
          enum:
          - error
      required:
      - error
      - status
      type: object
      description: 'The Error object is returned from the api any time there is an error.

        The message contains'
    NotificationBase:
      properties:
        url:
          type: string
        message:
          type: string
        resourceUuid:
          type: string
        viewed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        notificationId:
          type: string
      required:
      - viewed
      - createdAt
      - notificationId
      type: object
    NotificationContentReview:
      allOf:
      - $ref: '#/components/schemas/NotificationBase'
      - properties:
          metadata:
            properties:
              event:
                $ref: '#/components/schemas/ContentReviewNotificationEvent'
              requesterName:
                type: string
              targetSpaceName:
                type: string
              contentName:
                type: string
              contentUuid:
                type: string
              contentType:
                $ref: '#/components/schemas/ContentReviewContentType'
              projectUuid:
                type: string
              requestUuid:
                type: string
            required:
            - event
            - requesterName
            - targetSpaceName
            - contentName
            - contentUuid
            - contentType
            - projectUuid
            - requestUuid
            type: object
          resourceType:
            $ref: '#/components/schemas/ApiNotificationResourceType.ContentReview'
        required:
        - metadata
        - resourceType
        type: object
    ApiNotificationsResults:
      items:
        $ref: '#/components/schemas/Notification'
      type: array
    ApiNotificationResourceType.DashboardComments:
      enum:
      - dashboardComments
      type: string
    AiCreditAllowanceAlertThreshold:
      type: number
      enum:
      - 50
      - 80
      - 100
  securitySchemes:
    session_cookie:
      type: apiKey
      in: cookie
      name: connect.sid
    api_key:
      type: apiKey
      in: header
      name: Authorization
      description: Value should be 'ApiKey <your key>'
